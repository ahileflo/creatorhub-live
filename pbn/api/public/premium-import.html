<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importă fotografia ta</title>
<style>
  :root{--bg:#faf7f2;--ink:#1f1d1a;--muted:#6b6560;--acc:#b5532c;--card:#fff;--line:#e8e2d9}
  @media (prefers-color-scheme:dark){:root{--bg:#151412;--ink:#f1ede7;--muted:#a59e95;--card:#1f1d1a;--line:#2f2c28}}
  *{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:560px;margin:0 auto;padding:32px 16px}
  h1{font-size:1.6rem;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
  button,label.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:10px;border:0;font:600 1rem system-ui;cursor:pointer;background:var(--acc);color:#fff}
  label.btn input{display:none}.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
  select,input[type=email]{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
  #status{min-height:1.5em;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Alege fotografia pentru tabloul tău</h1>
  <p>Direct din Google Photos sau din iCloud / galeria telefonului. Nu trebuie să descarci nimic.</p>

  <div class="card">
    <input type="email" id="email" placeholder="email@exemplu.ro" autocomplete="email">
    <select id="colors"><option value="24">24 culori — recomandat</option><option value="36">36 culori — detaliat</option><option value="48">48 culori — expert</option></select>
    <select id="size"><option value="40x50">40 × 50 cm</option><option value="30x40">30 × 40 cm</option><option value="60x75">60 × 75 cm</option></select>
  </div>

  <div class="card">
    <button id="google">Importă din Google Photos</button>
  </div>
  <div class="card">
    <!-- Pe iPhone/iPad, acest input deschide Photo Picker-ul iOS cu toată biblioteca iCloud Photos -->
    <label class="btn alt">Alege din iCloud / galerie / calculator
      <input type="file" id="file" accept="image/jpeg,image/png,image/heic,image/heif,image/webp">
    </label>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const say = (t) => { $('status').textContent = t; };
const api = async (url, opts = {}) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
};

async function ensureOrder(source) {
  let id = sessionStorage.getItem('orderId');
  if (id) return id;
  const [w, h] = $('size').value.split('x').map(Number);
  const o = await api('/api/orders', { method: 'POST', body: JSON.stringify({
    email: $('email').value, tier: 'premium', nColors: Number($('colors').value), widthCm: w, heightCm: h, source }) });
  sessionStorage.setItem('orderId', o.id);
  return o.id;
}

async function waitForJob(jobId) {
  say('Procesăm fotografia…');
  for (;;) {
    const j = await api(`/api/jobs/${jobId}`);
    if (j.status === 'done') return say('Gata! Previzualizarea a fost trimisă pe email.');
    if (j.status === 'failed') return say('Nu am putut procesa poza. Te contactăm noi.');
    await new Promise((r) => setTimeout(r, 3000));
  }
}

// ---- iCloud / galerie: upload direct în S3 cu URL pre-semnat
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const orderId = await ensureOrder('device');
    say('Se încarcă…');
    const { url, key } = await api(`/api/orders/${orderId}/upload-url`, { method: 'POST', body: JSON.stringify({ mimeType: f.type, size: f.size }) });
    const put = await fetch(url, { method: 'PUT', body: f, headers: { 'Content-Type': f.type, 'x-amz-server-side-encryption': 'AES256', 'x-amz-tagging': 'retention=customer-original' } });
    if (!put.ok) throw new Error('Upload eșuat');
    const { jobId } = await api(`/api/orders/${orderId}/uploaded`, { method: 'POST', body: JSON.stringify({ key }) });
    await waitForJob(jobId);
  } catch (err) { say(err.message); }
});

// ---- Google Photos Picker
$('google').addEventListener('click', async () => {
  try {
    await ensureOrder('google_photos');
    let s;
    try { s = await api('/api/google/sessions', { method: 'POST' }); }
    catch { location.href = '/auth/google'; return; } // nu e conectat încă -> OAuth
    const win = window.open(s.pickerUri, 'gphotos', 'width=1000,height=760');
    say('Alege o fotografie în fereastra Google Photos…');
    const every = parseFloat(s.pollingConfig?.pollInterval) * 1000 || 3000;
    for (;;) {
      await new Promise((r) => setTimeout(r, every));
      const st = await api(`/api/google/sessions/${s.id}`);
      if (st.mediaItemsSet) break;
      if (win && win.closed) { await new Promise((r) => setTimeout(r, every)); if (!(await api(`/api/google/sessions/${s.id}`)).mediaItemsSet) return say('Fereastra a fost închisă.'); break; }
    }
    say('Importăm fotografia…');
    const { jobId } = await api(`/api/google/sessions/${s.id}/import`, { method: 'POST', body: JSON.stringify({ orderId: sessionStorage.getItem('orderId') }) });
    await waitForJob(jobId);
  } catch (err) { say(err.message); }
});
if (new URLSearchParams(location.search).get('google') === 'connected') say('Google Photos conectat. Apasă din nou butonul.');
</script>
</body>
</html>
