# Stack local complet: docker compose up --build
# MinIO = S3 local (consola: http://localhost:9001, user/parolă: minio/minio12345)
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: pbn, POSTGRES_PASSWORD: pbn, POSTGRES_DB: pbn }
    volumes: [ "./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" ]
    ports: [ "5432:5432" ]
  redis:
    image: redis:7
    ports: [ "6379:6379" ]
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: [ "9000:9000", "9001:9001" ]
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on: [ minio ]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 minio minio12345 && mc mb -p local/pbn-dev"
  api:
    build: ./api
    env_file: ./api/.env.example
    environment:
      DATABASE_URL: postgres://pbn:pbn@postgres:5432/pbn
      REDIS_URL: redis://redis:6379
      S3_BUCKET: pbn-dev
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    depends_on: [ postgres, redis, minio-init ]
    ports: [ "8080:8080" ]
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    environment:
      DATABASE_URL: postgres://pbn:pbn@postgres:5432/pbn
      REDIS_URL: redis://redis:6379
      STORAGE_BACKEND: s3
      S3_BUCKET: pbn-dev
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
    depends_on: [ postgres, redis, minio-init ]
    deploy: { replicas: 2 }
