<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recikeep — rețetele tale, pas cu pas</title>
<meta name="description" content="Recikeep: păstrează-ți rețetele originale cu poze și video la fiecare pas, ține-ți seria de gătit și transformă-le în produse digitale.">
<meta name="theme-color" content="#e8603c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recikeep">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f2;--card:#ffffff;--line:#f0dfd2;--ink:#2b1d16;--soft:#7d6558;
    --accent:#e8603c;--accent2:#f4a340;--ok:#2f9e6e;--chip:#fdebdf;--shadow:0 6px 20px rgba(120,60,20,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#17110e;--card:#221915;--line:#3a2b23;--ink:#f6ebe4;--soft:#b89c8d;
      --accent:#ff7a52;--accent2:#ffb457;--ok:#46c08b;--chip:#33241c;--shadow:0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17110e;--card:#221915;--line:#3a2b23;--ink:#f6ebe4;--soft:#b89c8d;
    --accent:#ff7a52;--accent2:#ffb457;--ok:#46c08b;--chip:#33241c;--shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:86px;min-height:100vh}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;line-height:1.2}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;max-width:860px;margin:0 auto}
  .logo{font-family:'Fraunces',serif;font-weight:800;font-size:1.5rem;color:var(--accent)}
  .logo small{display:block;font-family:'Inter';font-weight:600;font-size:.72rem;color:var(--soft);letter-spacing:.04em}
  .streak-pill{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer;border:0}
  .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn.sm{padding:7px 11px;font-size:.88rem;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:10px 0}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.88rem;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:12px 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .rcard{cursor:pointer;transition:transform .15s}
  .rcard:hover{transform:translateY(-2px)}
  .cover{aspect-ratio:16/10;width:100%;object-fit:cover;display:block;background:var(--chip)}
  .ph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:3.2rem;background:linear-gradient(135deg,var(--accent2),var(--accent))}
  .rbody{padding:12px 14px}
  .rbody h3{font-size:1.08rem;margin-bottom:4px}
  .meta{color:var(--soft);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap}
  .badge{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:700;color:var(--accent)}
  section.view{display:none;padding-top:6px}
  section.view.on{display:block}
  .hero{border-radius:18px;padding:18px;margin:6px 0 10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .hero h1{font-size:1.5rem}
  .hero p{opacity:.92;font-size:.95rem}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
  nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.72rem;gap:2px;color:var(--soft);cursor:pointer;padding:4px 8px;border-radius:10px;font-weight:600}
  nav.bottom button span{font-size:1.3rem}
  nav.bottom button.on{color:var(--accent)}
  .detail-head{margin:10px 0}
  .detail-head h1{font-size:1.8rem}
  .panel{padding:16px;margin-bottom:14px}
  .panel h2{font-size:1.15rem;margin-bottom:10px}
  .ing{list-style:none}
  .ing li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ing li:last-child{border:0}
  .ing input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
  .ing li.done span{text-decoration:line-through;color:var(--soft)}
  .step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border:0}
  .num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .media{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-top:8px;background:#000}
  .scaler{display:flex;align-items:center;gap:8px}
  .scaler button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}
  label.f{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
  .in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
  textarea.in{min-height:70px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .estep{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
  .estep .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
  .thumb{margin-top:8px;max-width:100%;max-height:180px;border-radius:10px;display:block}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .notice{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--soft);margin:10px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .stat{padding:14px;text-align:center}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:2rem;color:var(--accent)}
  .stat small{color:var(--soft);font-size:.8rem}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal div{aspect-ratio:1;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--soft)}
  .cal div.on{background:var(--accent);color:#fff;font-weight:700}
  .cal div.today{outline:2px solid var(--accent2)}
  .cal .dn{background:none;font-weight:700}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .bdg{padding:12px;text-align:center;opacity:.35}
  .bdg.got{opacity:1}
  .bdg span{font-size:2rem;display:block}
  .bdg small{font-size:.78rem;color:var(--soft)}
  /* mod gătit */
  #cook{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
  #cook.on{display:flex}
  .cook-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .bar{height:6px;background:var(--chip)}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .cook-body{flex:1;overflow:auto;padding:18px 16px;max-width:760px;margin:0 auto;width:100%}
  .cook-body .big{font-size:1.25rem;line-height:1.6;margin:12px 0}
  .cook-body .media{max-height:48vh}
  .timer{font-family:'Fraunces',serif;font-size:2.4rem;text-align:center;margin:10px 0}
  .cook-nav{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .cook-nav .btn{flex:1;padding:14px}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  .prod{padding:16px;margin-bottom:12px}
  .prod h3{font-size:1.15rem}
  .price{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--accent)}
  .pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
  .pick label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:.92rem}
  .empty{text-align:center;color:var(--soft);padding:30px 10px}
  video.gif{cursor:pointer}
  /* animație rețetă */
  #anim{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;color:#fff}
  #anim.on{display:flex}
  #anim.paused *{animation-play-state:paused!important}
  .anim-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .anim-stage img,.anim-stage video{width:100%;height:100%;object-fit:cover}
  .anim-stage img.kb{animation:kb 3.2s ease-out forwards}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
  .anim-card{font-size:6rem;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f4a340,#e8603c);animation:pop .5s ease-out}
  .anim-card b{font-family:'Fraunces',serif;font-size:1.6rem;text-align:center;padding:0 20px}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  .anim-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 22px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:1.08rem;animation:pop .5s ease-out}
  .anim-cap .num{display:inline-flex;margin-right:8px;vertical-align:middle}
  .anim-dots{display:flex;gap:4px;padding:10px 14px}
  .anim-dots i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
  .anim-dots i.done{background:#fff}
  .anim-dots i.cur::after{content:'';display:block;height:100%;background:#fff;animation:fill var(--d,3s) linear forwards}
  @keyframes fill{from{width:0}to{width:100%}}
  .anim-bar{display:flex;gap:8px;justify-content:space-between;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  @media (prefers-reduced-motion:reduce){.anim-stage img.kb,.anim-card,.anim-cap{animation:none}}
  @media(max-width:560px){.two,.three{grid-template-columns:1fr}.detail-head h1{font-size:1.5rem}}
</style>
</head>
<body>

<header class="top">
  <div class="logo">Recikeep<small>Rețetele tale, pas cu pas</small></div>
  <div class="row">
    <button class="streak-pill" id="pill" title="Seria ta de gătit">🔥 <span id="pillN">0</span></button>
    <button class="streak-pill" id="themeBtn" title="Temă">🌗</button>
    <button class="streak-pill" id="accBtn" title="Cont și sincronizare">☁️ <span id="accDot"></span></button>
  </div>
</header>

<main class="wrap">

  <!-- ACASĂ -->
  <section class="view on" id="v-home">
    <div class="hero">
      <h1 id="heroTitle">Ce gătim azi?</h1>
      <p id="heroSub">Gătește o rețetă ca să-ți ții seria aprinsă.</p>
    </div>
    <input class="search" id="q" placeholder="🔎 Caută rețete, ingrediente…">
    <div class="chips" id="cats"></div>
    <div class="grid" id="list"></div>
  </section>

  <!-- DETALIU -->
  <section class="view" id="v-detail"></section>

  <!-- ADAUGĂ / EDITEAZĂ -->
  <section class="view" id="v-edit"></section>

  <!-- SERIE -->
  <section class="view" id="v-streak"></section>

  <!-- PRODUSE DIGITALE -->
  <section class="view" id="v-products"></section>

  <!-- CONT / CLOUD -->
  <section class="view" id="v-account"></section>

</main>

<div id="anim">
  <div class="anim-dots" id="animDots"></div>
  <div class="anim-stage" id="animStage"></div>
  <div class="anim-bar">
    <button class="btn ghost sm" id="animClose">✕ Închide</button>
    <button class="btn ghost sm" id="animPause">⏸ Pauză</button>
    <button class="btn sm" id="animGif">⬇️ Salvează GIF</button>
  </div>
</div>

<div id="cook">
  <div class="cook-top">
    <button class="btn ghost sm" id="cookClose">✕ Închide</button>
    <strong id="cookTitle"></strong>
    <span id="cookCount" class="meta"></span>
  </div>
  <div class="bar"><i id="cookBar"></i></div>
  <div class="cook-body" id="cookBody"></div>
  <div class="cook-nav">
    <button class="btn ghost" id="cookPrev">← Înapoi</button>
    <button class="btn" id="cookNext">Următorul →</button>
  </div>
</div>

<nav class="bottom">
  <button data-go="home" class="on"><span>🏠</span>Rețete</button>
  <button data-go="edit"><span>➕</span>Adaugă</button>
  <button data-go="streak"><span>🔥</span>Serie</button>
  <button data-go="products"><span>📦</span>Produse</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Recikeep — totul rulează local în browser.
   Textul rețetelor e salvat în localStorage, pozele și video-urile
   în IndexedDB (nu se urcă nicăieri).
   ============================================================ */

const KEY = 'recikeep_v1';
const CATS = ['Toate','Ciorbe','Feluri principale','Deserturi','Conserve','Mic dejun','Salate','Altele'];
const BADGES = [
  {n:1,  e:'🍳', t:'Prima rețetă'},
  {n:3,  e:'🔥', t:'3 zile la rând'},
  {n:7,  e:'⭐', t:'O săptămână'},
  {n:14, e:'🏅', t:'Două săptămâni'},
  {n:30, e:'👑', t:'O lună întreagă'},
  {n:100,e:'💎', t:'100 de zile'}
];

// Rețete de pornire scrise de la zero pentru Recikeep (text original, fără poze preluate).
const SEED = [
  {id:'s1',title:'Sarmale în foi de varză',cat:'Feluri principale',emoji:'🥬',time:180,servings:6,
   desc:'Sarmale moi, fierte încet, cu carne de porc și orez, așa cum se fac de sărbători.',
   ingredients:['1 varză murată mare','800 g carne tocată de porc','100 g orez','2 cepe','1 lingură pastă de roșii','200 g afumătură','1 lingură cimbru uscat','2 foi de dafin','sare și piper după gust'],
   steps:[
     {text:'Desfă foile de varză, taie cotorul gros din mijloc și pune-le la desărat în apă rece dacă sunt prea sărate.',min:0},
     {text:'Călește ceapa tocată mărunt în puțin ulei până devine sticloasă. Adaugă orezul spălat și amestecă 2 minute.',min:5},
     {text:'Amestecă carnea cu ceapa și orezul răcite, pasta de roșii, cimbrul, sare și piper. Frământă bine.',min:0},
     {text:'Pune câte o lingură de umplutură pe fiecare foaie, rulează strâns și împinge capetele înăuntru.',min:0},
     {text:'Așază în oală un strat de varză tocată, apoi sarmalele, bucățile de afumătură și foile de dafin. Acoperă cu apă.',min:0},
     {text:'Fierbe la foc mic, cu capac, cel puțin 2 ore și jumătate. Servește cu smântână și mămăligă.',min:150}
   ]},
  {id:'s2',title:'Mămăligă cu brânză și smântână',cat:'Mic dejun',emoji:'🌽',time:30,servings:4,
   desc:'Mămăligă pufoasă, cu brânză de burduf și smântână groasă. Simplă și sățioasă.',
   ingredients:['1 l apă','250 g mălai','1 linguriță sare','30 g unt','300 g brânză de burduf','200 g smântână'],
   steps:[
     {text:'Pune apa la fiert cu sarea. Când dă în clocot, presară mălaiul în ploaie, amestecând continuu.',min:0},
     {text:'Lasă la foc mic și amestecă des cu un făcăleț, ca să nu se formeze cocoloașe.',min:20},
     {text:'Adaugă untul la final și amestecă până se încorporează.',min:0},
     {text:'Servește mămăliga fierbinte, cu brânză sfărâmată deasupra și o lingură generoasă de smântână.',min:0}
   ]},
  {id:'s3',title:'Ciorbă de perișoare',cat:'Ciorbe',emoji:'🍲',time:75,servings:6,
   desc:'Ciorbă acrișoară cu perișoare fragede, legume și leuștean proaspăt.',
   ingredients:['500 g carne tocată','50 g orez','1 ou','1 morcov','1 păstârnac','1 ceapă','1 ardei','2 roșii','500 ml borș','1 legătură leuștean','sare și piper'],
   steps:[
     {text:'Taie legumele cubulețe și pune-le la fiert în 2,5 l apă cu puțină sare.',min:15},
     {text:'Amestecă carnea cu orezul, oul, sare și piper. Formează bile mici cu mâinile ude.',min:0},
     {text:'Lasă perișoarele în ciorbă una câte una, la foc mic, ca să nu se desfacă.',min:25},
     {text:'Adaugă roșiile tocate și borșul fiert separat. Mai fierbe 5 minute.',min:5},
     {text:'Stinge focul, presară leușteanul tocat și potrivește de sare și acreală.',min:0}
   ]},
  {id:'s4',title:'Papanași cu dulceață',cat:'Deserturi',emoji:'🍩',time:40,servings:4,
   desc:'Gogoși din brânză dulce de vaci, prăjite, cu smântână și dulceață de afine.',
   ingredients:['500 g brânză dulce de vaci','2 ouă','3 linguri zahăr','1 plic zahăr vanilat','coaja de la o lămâie','250 g făină','1/2 linguriță bicarbonat','ulei pentru prăjit','smântână și dulceață pentru servire'],
   steps:[
     {text:'Amestecă brânza cu ouăle, zahărul, vanilia și coaja de lămâie.',min:0},
     {text:'Adaugă făina amestecată cu bicarbonatul până obții un aluat moale care nu se lipește.',min:0},
     {text:'Formează gogoși cu gaură și bile mici pentru „căciulițe”.',min:0},
     {text:'Prăjește-le în ulei încins la foc mediu până devin aurii pe ambele părți.',min:6},
     {text:'Pune papanașii pe hârtie absorbantă, apoi servește-i cu smântână și dulceață.',min:0}
   ]},
  {id:'s5',title:'Zacuscă de vinete',cat:'Conserve',emoji:'🫙',time:150,servings:10,
   desc:'Zacuscă de casă cu vinete coapte și ardei copți, pentru cămară.',
   ingredients:['2 kg vinete','2 kg ardei kapia','1 kg ceapă','500 ml bulion','400 ml ulei','3 foi de dafin','sare și piper boabe'],
   steps:[
     {text:'Coace vinetele și ardeii pe plită sau în cuptor, apoi curăță-i de coajă.',min:40},
     {text:'Toacă vinetele cu un cuțit de lemn și taie ardeii mărunt.',min:0},
     {text:'Călește ceapa tocată în ulei până se înmoaie bine.',min:15},
     {text:'Adaugă ardeii, apoi vinetele, bulionul, dafinul, sare și piper. Fierbe la foc mic, amestecând des.',min:60},
     {text:'Pune zacusca fierbinte în borcane sterilizate, închide-le și lasă-le la răcit învelite.',min:0}
   ]}
];

/* ---------- stare ---------- */
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); d.deleted=d.deleted||{}; return d; }
  }catch(e){}
  return {recipes:SEED.map(r=>({...r,author:'Recikeep',license:'CC0',steps:r.steps.map(s=>({...s,media:null,mediaType:null})),cover:null,fav:false,created:Date.now()})),
          log:{}, products:[], deleted:{}, theme:null};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ Nu am putut salva (spațiu plin?)'); }
  scheduleSync();
}

/* ---------- IndexedDB pentru poze/video ---------- */
let dbP = null;
function db(){
  if(dbP) return dbP;
  dbP = new Promise((res,rej)=>{
    const r = indexedDB.open('recikeep_media',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('m');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
  return dbP;
}
async function putMedia(blob){
  const id = 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const d = await db();
  await new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});
  return id;
}
async function putMediaId(id,blob){
  const d = await db();
  await new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});
}
async function getMedia(id){
  if(!id) return null;
  try{
    const d = await db();
    return await new Promise(res=>{const q=d.transaction('m').objectStore('m').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});
  }catch(e){return null;}
}
async function delMedia(id){
  if(!id) return;
  try{const d=await db();d.transaction('m','readwrite').objectStore('m').delete(id);}catch(e){}
}
const urlCache = {};
async function mediaURL(id){
  if(!id) return null;
  if(urlCache[id]) return urlCache[id];
  const b = await getMedia(id);
  if(!b) return null;
  return urlCache[id] = URL.createObjectURL(b);
}
// Completează asincron toate elementele cu data-media="id"
async function hydrate(root){
  for(const el of root.querySelectorAll('[data-media]')){
    const u = await mediaURL(el.dataset.media);
    if(u) el.src = u; else el.remove();
  }
}

/* ---------- serie (streak) ---------- */
function streak(){
  const days = new Set(Object.keys(S.log).filter(k=>S.log[k]?.length));
  let cur=0, d=new Date();
  if(!days.has(dkey(d))) d.setDate(d.getDate()-1); // seria rămâne vie până la finalul zilei de azi
  while(days.has(dkey(d))){cur++;d.setDate(d.getDate()-1);}
  // cea mai lungă serie
  const sorted=[...days].sort(); let best=0,run=0,prev=null;
  for(const k of sorted){
    const t=new Date(k+'T12:00:00');
    run = prev && (t-prev)/864e5<1.5 ? run+1 : 1;
    best=Math.max(best,run); prev=t;
  }
  const total = Object.values(S.log).reduce((a,v)=>a+(v?.length||0),0);
  return {cur,best,total,days,cookedToday:days.has(today())};
}
function markCooked(id){
  const k=today(); S.log[k]=S.log[k]||[];
  const before=streak().cur;
  S.log[k].push(id); save();
  const st=streak();
  const nb=BADGES.find(b=>b.n===st.cur && b.n>before);
  toast(nb ? `${nb.e} Insignă nouă: ${nb.t}!` : `🔥 Serie: ${st.cur} ${st.cur===1?'zi':'zile'}`);
  refreshPill();
}
function refreshPill(){
  const st=streak();
  $('#pillN').textContent=st.cur;
  $('#heroTitle').textContent = st.cookedToday ? `🔥 ${st.cur} ${st.cur===1?'zi':'zile'} la rând!` : 'Ce gătim azi?';
  $('#heroSub').textContent = st.cookedToday ? 'Ai gătit azi. Revino mâine ca să crească seria.'
    : st.cur ? `Seria ta de ${st.cur} ${st.cur===1?'zi':'zile'} se pierde la miezul nopții — gătește ceva azi!`
    : 'Gătește o rețetă ca să-ți aprinzi seria.';
}

let ck={id:null,i:0,timer:null,left:0};
function openCook(id){ ck={id,i:0,timer:null,left:0}; $('#cook').classList.add('on'); document.body.style.overflow='hidden'; drawCook(); try{navigator.wakeLock?.request('screen').then(l=>ck.lock=l).catch(()=>{});}catch(e){} }
function closeCook(){ clearInterval(ck.timer); ck.lock?.release?.(); $('#cook').classList.remove('on'); document.body.style.overflow=''; }
function drawCook(){
  const r=byId(ck.id), n=r.steps.length, last=ck.i===n;
  clearInterval(ck.timer); ck.timer=null;
  $('#cookTitle').textContent=r.title;
  $('#cookCount').textContent= last?'Gata!':`Pasul ${ck.i+1} / ${n}`;
  $('#cookBar').style.width=(ck.i/n*100)+'%';
  $('#cookPrev').disabled=ck.i===0;
  const B=$('#cookBody');
  if(last){
    B.innerHTML=`<div style="text-align:center;padding-top:30px"><div style="font-size:4rem">🎉</div><h2>Poftă bună!</h2>
      <p class="big">Ai terminat <b>${esc(r.title)}</b>.</p>

    $('#ckDone').onclick=()=>{markCooked(r.id);closeCook();renderDetail(r.id);};
    $('#cookNext').textContent='Închide'; return;
  }
  const s=r.steps[ck.i];
  $('#cookNext').textContent= ck.i===n-1 ? 'Termină ✓' : 'Următorul →';
  B.innerHTML=`<div class="num" style="width:46px;height:46px;font-size:1.3rem">${ck.i+1}</div>
    <p class="big">${esc(s.text)}</p>
    ${s.media?(s.mediaType==='video'?`<video class="media gif" playsinline autoplay muted loop data-media="${s.media}"></video>`:`<img class="media" data-media="${s.media}" alt="">`):''}
    ${s.min?`<div class="card panel" style="margin-top:14px;text-align:center" id="tmBox"><div class="timer" id="tm">${mmss(s.min*60)}</div>
      <button class="btn" id="tmBtn">▶ Pornește cronometrul</button></div>`:''}`;
  if(s.min){
    ck.left=s.min*60;
    $('#tmBtn').onclick=()=>{
      if(ck.timer){clearInterval(ck.timer);ck.timer=null;$('#tmBtn').textContent='▶ Continuă';return;}
      $('#tmBtn').textContent='⏸ Pauză';
      ck.timer=setInterval(()=>{
        ck.left--; const el=$('#tm'); if(el) el.textContent=mmss(Math.max(0,ck.left));
        if(ck.left<=0){clearInterval(ck.timer);ck.timer=null;beep();toast('⏰ Timpul a expirat!');if($('#tmBtn'))$('#tmBtn').textContent='✓ Gata';}
      },1000);
    };
  }
  B.querySelectorAll('video.gif').forEach(gifVideo);
  hydrate(B);
}
const mmss=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+1.2);o.stop(a.currentTime+1.2);navigator.vibrate?.([300,150,300]);}catch(e){}}

function drawSteps(){
  const W=$('#eSteps');
  W.innerHTML=draft.steps.map((s,k)=>`<div class="estep" data-k="${k}">
    <div class="hd"><span>Pasul ${k+1}</span><span class="row">
      <button class="btn ghost sm" data-a="up" ${k===0?'disabled':''}>↑</button>
      <button class="btn ghost sm" data-a="down" ${k===draft.steps.length-1?'disabled':''}>↓</button>
      <button class="btn ghost sm" data-a="del" ${draft.steps.length===1?'disabled':''}>🗑</button></span></div>
    <textarea class="in" placeholder="Descrie ce se face la acest pas…">${esc(s.text)}</textarea>
    <div class="row" style="margin-top:8px">
      <label class="meta">⏲ Cronometru (min) <input type="number" min="0" class="in" style="width:80px;display:inline-block;padding:6px 8px" value="${s.min||0}"></label>
      <span class="btn ghost sm file-btn">📷 Poză / GIF<input type="file" accept="image/*" data-a="img"></span>
      <span class="btn ghost sm file-btn">🎬 Video<input type="file" accept="video/*" data-a="vid"></span>
      ${s.media?'<button class="btn ghost sm" data-a="rm">✕ Scoate media</button>':''}
    </div>
    ${s.media?(s.mediaType==='video'?`<video class="thumb" controls playsinline preload="metadata" data-media="${s.media}"></video>`:`<img class="thumb" data-media="${s.media}">`):''}
  </div>`).join('');
  W.querySelectorAll('.estep').forEach(el=>{
    const k=+el.dataset.k;
    el.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      syncDraft(); const a=b.dataset.a, st=draft.steps;
      if(a==='up'){[st[k-1],st[k]]=[st[k],st[k-1]];}
      if(a==='down'){[st[k+1],st[k]]=[st[k],st[k+1]];}
      if(a==='del'){st.splice(k,1);}
      if(a==='rm'){st[k].media=null;st[k].mediaType=null;}
      drawSteps();
    });
    el.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      const isVid=inp.dataset.a==='vid';
      if(isVid && f.size>50*1024*1024){toast('Clip prea mare (max 50 MB) — filmează scurt, ca un GIF');return;}
      toast(isVid?'Se salvează clipul…':'Se salvează poza…');
      syncDraft();
      const id=await putMedia(isVid?f:await shrink(f)); draft._new.push(id);
      draft.steps[k].media=id; draft.steps[k].mediaType=isVid?'video':'image';
      drawSteps(); hydrate(W);
    });
  });
  hydrate(W);
}
// micșorează pozele mari ca să nu umple memoria
function shrink(file,max=1600){
  return new Promise(res=>{
    if(file.type==='image/gif') return res(file); // păstrăm animația GIF
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      if(k===1 && file.size<1.5e6){URL.revokeObjectURL(u);return res(file);}
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b=>res(b||file),'image/jpeg',.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    img.src=u;
  });
}
function saveDraft(){
  syncDraft();
  if(!draft.title) return toast('Pune un titlu rețetei');
  if(!draft.steps.some(s=>s.text)) return toast('Adaugă cel puțin un pas');
  if(!draft._ok) return toast('Bifează confirmarea de originalitate');
  draft.steps=draft.steps.filter(s=>s.text||s.media);
  const used=new Set([draft.cover,...draft.steps.map(s=>s.media)].filter(Boolean));
  [...draft._orig,...draft._new].forEach(m=>{if(!used.has(m)) delMedia(m);});
  const {_orig,_new,_ok,...clean}=draft; clean.updated=Date.now();
  if(clean.id){ S.recipes=S.recipes.map(x=>x.id===clean.id?{...x,...clean}:x); }
  else { clean.id=uid(); clean.created=Date.now(); S.recipes.unshift(clean); }
  save(); toast('✅ Rețetă salvată'); go('detail',clean.id);
}

const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
async function exportBackup(){
  toast('Se pregătește backup-ul…');
  const media={};
  for(const r of S.recipes){
    for(const id of [r.cover,...r.steps.filter(s=>s.mediaType!=='video').map(s=>s.media)]){
      if(id&&!media[id]){const b=await getMedia(id);if(b) media[id]=await blobToData(b);}
    }
  }
  download(new Blob([JSON.stringify({app:'recikeep',v:1,data:S,media})],{type:'application/json'}),'recikeep-backup-'+today()+'.json');
}
async function importBackup(e){
  const f=e.target.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text());
    if(j.app!=='recikeep') throw 0;
    if(!confirm('Înlocuiești datele actuale cu cele din backup?')) return;
    const d=await db();
    for(const [id,data] of Object.entries(j.media||{})){
      const b=await (await fetch(data)).blob();
      await new Promise(res=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(b,id);t.oncomplete=res;t.onerror=res;});
    }
    S=j.data; save(); applyTheme(); refreshPill(); toast('✅ Backup importat'); go('home');
  }catch(err){toast('Fișier de backup invalid');}
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

async function buildEbook(p,forPrint){

  for(const r of rs){
    const cov=await data(r.cover);
    let steps='';
    for(const [k,s] of r.steps.entries()){
      let m='';
      if(s.media){
        if(s.mediaType==='video'){
          const b=await getMedia(s.media);
          // în PDF nu se pot reda clipuri; în HTML le includem dacă nu sunt uriașe
          if(b && !forPrint && b.size<25e6) m=`<video autoplay muted loop playsinline controls src="${await blobToData(b)}"></video>`;
          else if(b) m=`<p class="vnote">🎬 Acest pas are un clip video în versiunea digitală.</p>`;

      }
      steps+=`<li><div>${esc(s.text)}${s.min?` <em>(${fmtTime(s.min)})</em>`:''}</div>${m}</li>`;

    body+=`<article>
      ${cov?`<img class="cov" src="${cov}" alt="">`:`<div class="ph">${esc(r.emoji||'🍽️')}</div>`}
      <h2>${esc(r.title)}</h2><p class="d">${esc(r.desc)}</p>
      <p class="m">⏱ ${fmtTime(r.time)||'—'} · 👥 ${r.servings} porții · ${esc(r.cat)}</p>
      <h3>Ingrediente</h3><ul>${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      <h3>Mod de preparare</h3><ol>${steps}</ol>
      <p class="lic">Rețetă de ${esc(r.author||p.author||'autor')} · ${esc(licName(r.license))}</p>
    </article>`;
  }
  const year=new Date().getFullYear();
  return `<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(p.title)}</title><style>
body{font-family:Georgia,serif;max-width:760px;margin:0 auto;padding:24px 16px;color:#2b1d16;background:#fffaf5;line-height:1.6}
.title{text-align:center;padding:60px 0;border-bottom:3px solid #e8603c;margin-bottom:30px}

article{page-break-before:always;margin-bottom:50px}
h2{color:#e8603c;font-size:1.7rem;margin:16px 0 4px}.d{font-style:italic}.m{color:#7d6558;font-size:.9rem}
img,video{max-width:100%;border-radius:10px;display:block;margin:8px 0}.cov{width:100%;max-height:380px;object-fit:cover}
.ph{font-size:4rem;text-align:center;background:#fdebdf;border-radius:12px;padding:30px}
ol li{margin-bottom:14px}.lic,.vnote{color:#7d6558;font-size:.82rem}
.toc a{color:#2b1d16}footer{text-align:center;color:#7d6558;font-size:.8rem;border-top:1px solid #f0dfd2;padding-top:14px}
@media print{body{background:#fff}video{display:none}}
</style></head><body>
<div class="title"><h1>${esc(p.title)}</h1><p>${esc(p.desc)}</p><p><b>${esc(p.author)}</b></p></div>
<div class="toc"><h3>Cuprins</h3><ol>${rs.map(r=>`<li>${esc(r.title)}</li>`).join('')}</ol></div>
${body}
<footer>© ${year} ${esc(p.author||'Autorul')} · Creat cu Recikeep</footer>
${forPrint?'<script>window.onload=()=>setTimeout(()=>print(),400)<\/script>':''}
</body></html>`;
}

// Clipurile de la pași se comportă ca un GIF: buclă fără sunet; o atingere pornește/oprește sunetul.
function gifVideo(v){
  v.onclick=()=>{v.muted=!v.muted; if(v.paused) v.play().catch(()=>{}); toast(v.muted?'🔇 Fără sunet':'🔊 Cu sunet');};

let an={id:null,i:0,t:null,paused:false};
const AN_MS=3200;
function openAnim(id){
  an={id,i:0,t:null,paused:false};
  $('#anim').classList.add('on'); $('#anim').classList.remove('paused');
  document.body.style.overflow='hidden'; $('#animPause').textContent='⏸ Pauză';
  animStep(0);
}
function closeAnim(){ clearTimeout(an.t); $('#anim').classList.remove('on'); document.body.style.overflow=''; $('#animStage').innerHTML=''; }
// slide 0 = titlu, 1..n = pași, n+1 = final
async function animStep(i){
  const r=byId(an.id); if(!r) return closeAnim();
  const n=r.steps.length;
  clearTimeout(an.t);
  if(i<0) i=0;
  if(i>n+1) i=0;
  an.i=i;
  $('#animDots').innerHTML=Array.from({length:n+2},(_,k)=>`<i class="${k<i?'done':k===i?'cur':''}" style="--d:${AN_MS}ms"></i>`).join('');
  const St=$('#animStage');
  if(i===0){
    St.innerHTML = r.cover
      ? `<img class="kb" data-media="${r.cover}" alt=""><div class="anim-cap"><b style="font-family:Fraunces,serif;font-size:1.5rem">${esc(r.title)}</b><br>${r.steps.length} pași · ${fmtTime(r.time)||''}</div>`
      : `<div class="anim-card">${esc(r.emoji||'🍽️')}<b>${esc(r.title)}</b></div>`;
  } else if(i===n+1){
    St.innerHTML=`<div class="anim-card">🎉<b>Poftă bună!</b></div>`;
  } else {
    const s=r.steps[i-1];
    const m = s.media ? (s.mediaType==='video'
        ? `<video autoplay muted loop playsinline data-media="${s.media}"></video>`
        : `<img class="kb" data-media="${s.media}" alt="">`)
      : `<div class="anim-card">${esc(r.emoji||'🍽️')}<b>Pasul ${i}</b></div>`;
    St.innerHTML = m + `<div class="anim-cap"><span class="num">${i}</span>${esc(s.text)}</div>`;
  }
  await hydrate(St);
  if(an.i===i && !an.paused && $('#anim').classList.contains('on')) an.t=setTimeout(()=>animStep(i+1),AN_MS);
}
$('#animClose').onclick=closeAnim;
$('#animPause').onclick=()=>{
  an.paused=!an.paused;
  $('#anim').classList.toggle('paused',an.paused);
  $('#animPause').textContent=an.paused?'▶ Continuă':'⏸ Pauză';
  if(an.paused) clearTimeout(an.t); else animStep(an.i);
};
$('#animStage').onclick=e=>{ const w=e.currentTarget.clientWidth; animStep(e.offsetX<w/3 ? an.i-1 : an.i+1); };
$('#animGif').onclick=()=>exportGif(an.id,$('#animGif'));

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
const loadVid=src=>new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.onloadeddata=()=>res(v);v.onerror=rej;v.src=src;});
const seek=(v,t)=>new Promise(res=>{const done=()=>{clearTimeout(h);res();};const h=setTimeout(res,1500);v.addEventListener('seeked',done,{once:true});v.currentTime=t;});

// Creează un GIF animat cu toți pașii rețetei (480×480), bun pentru Instagram, TikTok, WhatsApp.
async function exportGif(id,btn){
  const r=byId(id); if(!r) return;
  const old=btn?.textContent; if(btn){btn.disabled=true;btn.textContent='⏳ Se creează…';}
  try{
    const {GIFEncoder,quantize,applyPalette}=await import('./vendor/gifenc.esm.js');
    const W=480,H=480,c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});
    const gif=GIFEncoder();
    const add=delay=>{const d=x.getImageData(0,0,W,H).data;const pal=quantize(d,256);gif.writeFrame(applyPalette(d,pal),W,H,{palette:pal,delay});};
    const wrap=(text,maxW,maxL)=>{
      const out=[]; let line='';
      for(const w of text.split(/\s+/)){
        const t=line?line+' '+w:w;
        if(x.measureText(t).width>maxW && line){out.push(line);line=w;} else line=t;
      }
      if(line) out.push(line);
      if(out.length>maxL){out.length=maxL;out[maxL-1]=out[maxL-1].replace(/\s*\S*$/,'')+'…';}
      return out;
    };
    const bg=()=>{const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f4a340');g.addColorStop(1,'#e8603c');x.fillStyle=g;x.fillRect(0,0,W,H);};
    const card=(emoji,title,sub)=>{
      bg(); x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#fff';
      x.font='130px serif'; x.fillText(emoji,W/2,H*.38);
      x.font='800 34px Fraunces, Georgia, serif';
      wrap(title,W-60,3).forEach((l,k)=>x.fillText(l,W/2,H*.66+k*40));
      if(sub){x.font='600 18px Inter, sans-serif';x.globalAlpha=.85;x.fillText(sub,W/2,H-34);x.globalAlpha=1;}
    };
    const cover=(src,z)=>{
      const sw=src.videoWidth||src.naturalWidth, sh=src.videoHeight||src.naturalHeight;
      const k=Math.max(W/sw,H/sh)*z, dw=sw*k, dh=sh*k;
      x.fillStyle='#000'; x.fillRect(0,0,W,H); x.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
    };
    const caption=(num,text)=>{
      x.font='600 19px Inter, sans-serif'; x.textAlign='left'; x.textBaseline='alphabetic';
      const lines=wrap(text,W-(num?96:40),4), h=lines.length*25+34;
      const g=x.createLinearGradient(0,H-h-40,0,H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.35,'rgba(0,0,0,.75)'); g.addColorStop(1,'rgba(0,0,0,.9)');
      x.fillStyle=g; x.fillRect(0,H-h-40,W,h+40);
      const left=num?72:20;
      if(num){
        x.fillStyle='#e8603c'; x.beginPath(); x.arc(40,H-h+22,20,0,Math.PI*2); x.fill();
        x.fillStyle='#fff'; x.font='800 20px Inter, sans-serif'; x.textAlign='center'; x.fillText(num,40,H-h+29);
        x.textAlign='left'; x.font='600 19px Inter, sans-serif';
      }
      x.fillStyle='#fff'; lines.forEach((l,k)=>x.fillText(l,left,H-h+28+k*25));
    };
    // titlu
    const cv = r.cover && await loadImg(await mediaURL(r.cover)).catch(()=>null);
    if(cv){ for(let f=0;f<4;f++){cover(cv,1+f*.02);caption(0,r.title);add(400);} }
    else { card(r.emoji||'🍽️',r.title,`${r.steps.length} pași · Recikeep`); add(1600); }
    // pași
    for(const [k,s] of r.steps.entries()){
      if(btn) btn.textContent=`⏳ Pasul ${k+1}/${r.steps.length}`;
      const u = s.media && await mediaURL(s.media);
      if(u && s.mediaType==='video'){
        const v=await loadVid(u).catch(()=>null);
        if(v){ const dur=v.duration||2; for(let f=0;f<10;f++){await seek(v,Math.min(Math.max(0,dur-.05),f*.25));cover(v,1);caption(k+1,s.text);add(250);} continue; }
      }
      if(u){
        const im=await loadImg(u).catch(()=>null);
        if(im){ for(let f=0;f<5;f++){cover(im,1+f*.015);caption(k+1,s.text);add(440);} continue; }
      }
      card(r.emoji||'🍽️','Pasul '+(k+1)); caption(k+1,s.text); add(2400);
    }
    card('🎉','Poftă bună!',r.author?'Rețetă de '+r.author:'Creat cu Recikeep'); add(1800);
    gif.finish();
    const blob=new Blob([gif.bytes()],{type:'image/gif'}), name=slug(r.title)+'.gif';
    const file=new File([blob],name,{type:'image/gif'});
    if(navigator.canShare?.({files:[file]}) && matchMedia('(pointer:coarse)').matches){
      try{ await navigator.share({files:[file],title:r.title}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    download(blob,name); toast('✅ GIF salvat');
  }catch(e){ console.error(e); toast('Nu am putut crea GIF-ul'); }
  finally{ if(btn){btn.disabled=false;btn.textContent=old;} }
}

/* ---------- CLOUD: cont + sincronizare (Supabase) ---------- */
// Completează după ce creezi proiectul Supabase (vezi LANSARE.md). Cheia anon/publishable este publică
// prin design; fiecare utilizator își vede doar datele lui datorită politicilor RLS din supabase/.
const RK_CLOUD_DEFAULT = {url:'', key:''};
const CKEY='recikeep_cloud', BUCKET='recikeep-media';
let sb=null, cloudUser=null, syncT=null, syncing=false, syncAgain=false, lastSync=null, cloudErr='', otpEmail='';
function cloudCfg(){
  try{ const c=JSON.parse(localStorage.getItem(CKEY)||'null'); if(c?.url && c?.key) return c; }catch(e){}
  return RK_CLOUD_DEFAULT.url ? RK_CLOUD_DEFAULT : null;
}
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
function updDot(){ $('#accDot').textContent = !cloudUser ? '' : syncing ? '⏳' : cloudErr ? '⚠️' : '✓'; }
async function cloudInit(){
  const c=cloudCfg(); updDot(); if(!c) return;
  try{
    if(!window.supabase) await loadScript('vendor/supabase.js');
    sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'recikeep_auth'}});
    sb.auth.onAuthStateChange((ev,session)=>{
      const was=cloudUser; cloudUser=session?.user||null; updDot();
      // apelurile Supabase nu se fac direct în acest callback
      if(cloudUser && !was) setTimeout(syncNow,0);
      if($('#v-account').classList.contains('on')) setTimeout(renderAccount,0);
    });
  }catch(e){ cloudErr='Nu mă pot conecta la cloud.'; updDot(); }
}
function scheduleSync(){ if(!sb||!cloudUser) return; clearTimeout(syncT); syncT=setTimeout(syncNow,2500); }
function mergeState(A,B){
  const del={...(B.deleted||{})};
  for(const [k,v] of Object.entries(A.deleted||{})) del[k]=Math.max(del[k]||0,v);
  const ts=o=>o.updated||o.created||0;
  const mergeList=(a=[],b=[])=>{
    const m=new Map();
    [...b,...a].forEach(o=>{const p=m.get(o.id); if(!p||ts(o)>=ts(p)) m.set(o.id,o);}); // la egalitate câștigă local
    return [...m.values()].filter(o=>!(del[o.id]>=ts(o))).sort((x,y)=>(y.created||0)-(x.created||0));
  };
  const log={};
  for(const k of new Set([...Object.keys(A.log||{}),...Object.keys(B.log||{})])){
    const ca={},cb={};
    (A.log?.[k]||[]).forEach(i=>ca[i]=(ca[i]||0)+1);
    (B.log?.[k]||[]).forEach(i=>cb[i]=(cb[i]||0)+1);
    const out=[];
    for(const i of new Set([...Object.keys(ca),...Object.keys(cb)])) for(let n=Math.max(ca[i]||0,cb[i]||0);n>0;n--) out.push(i);
    if(out.length) log[k]=out;
  }
  return {recipes:mergeList(A.recipes,B.recipes),products:mergeList(A.products,B.products),log,deleted:del};
}
async function syncNow(){
  if(!sb||!cloudUser) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; updDot();
  const me=cloudUser.id, errs=[];
  try{
    const {data:row,error:e1}=await sb.from('recikeep_state').select('data').eq('user_id',me).maybeSingle();
    if(e1) throw e1;
    const M=mergeState(S,row?.data||{});
    const used=new Set();
    M.recipes.forEach(r=>[r.cover,...r.steps.map(s=>s.media)].forEach(m=>m&&used.add(m)));
    const remote=new Map();
    for(let off=0;;off+=1000){
      const {data:fl,error}=await sb.storage.from(BUCKET).list(me,{limit:1000,offset:off});
      if(error) throw error;
      fl.forEach(f=>remote.set(f.name,f));
      if(fl.length<1000) break;
    }
    for(const m of used){
      const local=await getMedia(m);
      if(local && !remote.has(m)){
        const {error}=await sb.storage.from(BUCKET).upload(`${me}/${m}`,local,{contentType:local.type||'application/octet-stream',upsert:true});
        if(error) errs.push(error.message);
      } else if(!local && remote.has(m)){
        const {data:bl,error}=await sb.storage.from(BUCKET).download(`${me}/${m}`);
        if(!error && bl) await putMediaId(m,bl);
      }
    }
    // fișiere orfane (rețete șterse) — doar cele mai vechi de o zi, ca să nu atingem upload-urile altui dispozitiv în curs
    const old=[...remote.values()].filter(f=>!used.has(f.name) && Date.now()-new Date(f.created_at).getTime()>864e5).map(f=>`${me}/${f.name}`);
    if(old.length) await sb.storage.from(BUCKET).remove(old);
    const {error:e2}=await sb.from('recikeep_state').upsert({user_id:me,data:M,updated_at:new Date().toISOString()});
    if(e2) throw e2;
    // îmbinăm din nou cu ce s-a modificat local între timp
    const F=mergeState(S,M); F.theme=S.theme; S=F;
    localStorage.setItem(KEY,JSON.stringify(S));
    lastSync=new Date(); cloudErr=errs.length?`${errs.length} fișiere nu s-au urcat (${errs[0]})`:'';
    refreshPill();
    if($('#v-home').classList.contains('on')) renderHome();
  }catch(e){ cloudErr=e.message||String(e); }
  finally{
    syncing=false; updDot();
    if(syncAgain){ syncAgain=false; scheduleSync(); }
    if($('#v-account').classList.contains('on')) renderAccount();
  }
}
function renderAccount(){
  const V=$('#v-account'), c=cloudCfg();
  let h=`<h1 style="margin:10px 0">☁️ Cont și sincronizare</h1>
    <div class="notice">Cu un cont, rețetele, pozele, clipurile, seria și produsele tale se sincronizează între telefon, tabletă și calculator. Fără cont, totul rămâne doar pe acest dispozitiv.</div>`;
  if(!c){
    h+=`<div class="card panel"><h2>🔌 Conectează serverul</h2>
      <p class="meta">Cloud-ul nu e configurat încă în această versiune. Introdu adresa proiectului Supabase și cheia publică.</p>
      <label class="f">URL proiect</label><input class="in" id="cU" placeholder="https://xxxx.supabase.co">
      <label class="f">Cheie publică (anon / publishable)</label><input class="in" id="cK">
      <button class="btn" id="cSave" style="margin-top:12px;width:100%">Salvează</button></div>`;
  } else if(!sb){
    h+=`<div class="card panel"><p>${esc(cloudErr||'Se conectează…')}</p></div>`;
  } else if(!cloudUser){
    h+=`<div class="card panel"><h2>🔐 Intră în cont</h2>
      <p class="meta">Fără parolă: primești pe email un cod de conectare.</p>
      <label class="f">Email</label><input class="in" id="aE" type="email" autocomplete="email" value="${esc(otpEmail)}" placeholder="tu@exemplu.ro">
      <button class="btn" id="aSend" style="margin-top:12px;width:100%">📧 Trimite codul</button>
      ${otpEmail?`<label class="f">Codul din email</label><input class="in" id="aC" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      <button class="btn ok" id="aVer" style="margin-top:12px;width:100%">✅ Confirmă</button>`:''}
      </div>
      ${RK_CLOUD_DEFAULT.url?'':'<button class="btn ghost sm" id="cForget">Deconectează serverul</button>'}`;
  } else {
    h+=`<div class="card panel"><h2>👤 ${esc(cloudUser.email||'Cont')}</h2>
      <p class="meta">${syncing?'⏳ Se sincronizează…':lastSync?'✓ Sincronizat la '+lastSync.toLocaleTimeString('ro-RO'):'Încă nesincronizat'}</p>
      ${cloudErr?`<div class="notice">⚠️ ${esc(cloudErr)}</div>`:''}
      <div class="row" style="margin-top:12px">
        <button class="btn" id="aSync" ${syncing?'disabled':''}>🔄 Sincronizează acum</button>
        <button class="btn ghost" id="aOut">Ieși din cont</button>
      </div></div>
      <div class="card panel"><h2>🗑 Șterge contul</h2>
      <p class="meta" style="margin-bottom:10px">Șterge definitiv contul și tot ce e salvat în cloud (rețete, poze, clipuri). Datele de pe acest dispozitiv rămân.</p>
      <button class="btn ghost sm" id="aDel">Șterge contul definitiv</button></div>`;
  }
  h+=`<p class="meta" style="margin:10px 0 28px"><a href="confidentialitate.html" style="color:var(--accent)">Politica de confidențialitate</a></p>`;
  V.innerHTML=h;
  const on=(id,fn)=>{const el=$('#'+id); if(el) el.onclick=fn;};
  on('cSave',()=>{
    const url=$('#cU').value.trim().replace(/\/$/,''), key=$('#cK').value.trim();
    if(!/^https:\/\/.+/.test(url)||!key) return toast('Completează URL-ul și cheia');
    localStorage.setItem(CKEY,JSON.stringify({url,key})); cloudInit().then(renderAccount);
  });
  on('cForget',()=>{localStorage.removeItem(CKEY);sb=null;renderAccount();});
  on('aSend',async()=>{
    const email=$('#aE').value.trim(); if(!/^\S+@\S+\.\S+$/.test(email)) return toast('Email invalid');
    const redirect=location.protocol.startsWith('http')?location.origin+location.pathname:undefined;
    const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:redirect}});
    if(error) return toast('⚠️ '+error.message);
    otpEmail=email; toast('📧 Ți-am trimis codul pe email'); renderAccount();
  });
  on('aVer',async()=>{
    const token=$('#aC').value.trim(); if(!token) return;
    const {error}=await sb.auth.verifyOtp({email:otpEmail,token,type:'email'});
    if(error) return toast('⚠️ Cod greșit sau expirat');
    toast('✅ Ai intrat în cont');
  });
  on('aSync',()=>syncNow());
  on('aOut',async()=>{await sb.auth.signOut(); toast('Ai ieșit din cont');});
  on('aDel',async()=>{
    if(!confirm('Ștergi definitiv contul și toate datele din cloud?')) return;
    try{
      const me=cloudUser.id;
      for(;;){
        const {data:fl}=await sb.storage.from(BUCKET).list(me,{limit:1000});
        if(!fl?.length) break;
        await sb.storage.from(BUCKET).remove(fl.map(f=>`${me}/${f.name}`));
        if(fl.length<1000) break;
      }
      const {error}=await sb.rpc('delete_my_account'); if(error) throw error;
      await sb.auth.signOut(); toast('Contul a fost șters');
    }catch(e){ toast('⚠️ '+(e.message||e)); }
  });
}

applyTheme(); refreshPill(); renderHome(); cloudInit();
if(location.hash==='#adauga') go('edit');
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
