# Self-checkup orar al tuturor site-urilor/API-urilor din portofoliu.
# Dacă ceva pică, deschide (sau comentează pe) un issue "🚨 Healthcheck" ca să primești notificare pe telefon.
name: Healthcheck
on:
  schedule: [ { cron: "17 * * * *" } ]
  workflow_dispatch:
permissions: { issues: write, contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: hc
        run: python ops/healthcheck.py
        continue-on-error: true
      - if: steps.hc.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('ops/last-failures.md') ? fs.readFileSync('ops/last-failures.md', 'utf8') : 'vezi log-ul';
            const title = '🚨 Healthcheck';
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'healthcheck' });
            const text = `${new Date().toISOString()}\n\n${body}\n\n[Run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            if (data.length) await github.rest.issues.createComment({ ...context.repo, issue_number: data[0].number, body: text });
            else await github.rest.issues.create({ ...context.repo, title, body: text, labels: ['healthcheck'] });
