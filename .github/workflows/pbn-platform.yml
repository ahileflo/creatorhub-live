name: pbn-platform

on:
  push:
    paths: ["pbn-platform/**", ".github/workflows/pbn-platform.yml"]
  pull_request:
    paths: ["pbn-platform/**", ".github/workflows/pbn-platform.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pbn-platform/processing/requirements.txt }
      - name: Install Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2 postgresql-client
          pip install -r pbn-platform/processing/requirements.txt
      - name: Python tests (pbn_engine, pbn_worker)
        working-directory: pbn-platform/processing
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: pbn-platform/api/package-lock.json }
      - name: Install Node deps
        working-directory: pbn-platform/api
        run: npm ci
      - name: API tests (unit + integration with Postgres, Redis and the Python worker)
        working-directory: pbn-platform/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
        run: npm test

      - name: Install Playwright (Chromium)
        working-directory: pbn-platform/api
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end test in the browser (full platform)
        working-directory: pbn-platform
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          SHOTS_DIR: ${{ github.workspace }}/e2e-shots
        run: scripts/e2e.sh
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: e2e-shots, if-no-files-found: ignore }
