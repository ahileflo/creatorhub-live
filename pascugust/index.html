<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pas cu Gust — rețetele tale, pas cu pas</title>
<meta name="description" content="Pas cu Gust: păstrează-ți rețetele originale cu poze și video la fiecare pas, ține-ți seria de gătit și transformă-le în produse digitale.">
<meta name="theme-color" content="#e8603c">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pas cu Gust">
<meta property="og:title" content="Pas cu Gust — rețetele tale, pas cu pas">
<meta property="og:description" content="Rețete cu poze și video la fiecare pas, seria de gătit și GIF-uri de trimis prietenilor. Gratuit, în română.">
<meta property="og:image" content="https://ahileflo.github.io/creatorhub-live/pascugust/icons/og-app.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pas cu Gust">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f2;--card:#ffffff;--line:#f0dfd2;--ink:#2b1d16;--soft:#7d6558;
    --accent:#e8603c;--accent2:#f4a340;--ok:#2f9e6e;--chip:#fdebdf;--shadow:0 6px 20px rgba(120,60,20,.08);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#17110e;--card:#221915;--line:#3a2b23;--ink:#f6ebe4;--soft:#b89c8d;
      --accent:#ff7a52;--accent2:#ffb457;--ok:#46c08b;--chip:#33241c;--shadow:0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17110e;--card:#221915;--line:#3a2b23;--ink:#f6ebe4;--soft:#b89c8d;
    --accent:#ff7a52;--accent2:#ffb457;--ok:#46c08b;--chip:#33241c;--shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:86px;min-height:100vh}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;letter-spacing:-.01em;line-height:1.2}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 8px;max-width:860px;margin:0 auto}
  .logo{font-family:'Fraunces',serif;font-weight:800;font-size:1.5rem;color:var(--accent)}
  .logo small{display:block;font-family:'Inter';font-weight:600;font-size:.72rem;color:var(--soft);letter-spacing:.04em}
  .streak-pill{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer;border:0}
  header.top .row{flex-wrap:nowrap;gap:6px}
  .logo small{white-space:nowrap}
  @media(max-width:440px){.logo small{display:none}header.top .streak-pill{padding:6px 9px;gap:3px}header.top{padding-left:12px;padding-right:12px}}
  @media(max-width:380px){.logo{font-size:1.25rem}header.top .streak-pill{padding:5px 7px}}
  .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn.ghost{background:var(--chip);color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn.sm{padding:7px 11px;font-size:.88rem;border-radius:10px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin:10px 0}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:.88rem;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:12px 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .rcard{cursor:pointer;transition:transform .15s}
  .rcard:hover{transform:translateY(-2px)}
  .cover{aspect-ratio:16/10;width:100%;object-fit:cover;display:block;background:var(--chip)}
  .ph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:3.2rem;background:linear-gradient(135deg,var(--accent2),var(--accent))}
  .rbody{padding:12px 14px}
  .rbody h3{font-size:1.08rem;margin-bottom:4px}
  .meta{color:var(--soft);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap}
  .badge{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:700;color:var(--accent)}
  section.view{display:none;padding-top:6px}
  section.view.on{display:block}
  .hero{border-radius:18px;padding:18px;margin:6px 0 10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .hero h1{font-size:1.5rem}
  .hero p{opacity:.92;font-size:.95rem}
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
  nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.72rem;gap:2px;color:var(--soft);cursor:pointer;padding:4px 8px;border-radius:10px;font-weight:600}
  nav.bottom button span{font-size:1.3rem}
  nav.bottom button.on{color:var(--accent)}
  .detail-head{margin:10px 0}
  .detail-head h1{font-size:1.8rem}
  .panel{padding:16px;margin-bottom:14px}
  .panel h2{font-size:1.15rem;margin-bottom:10px}
  .ing{list-style:none}
  .ing li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ing li:last-child{border:0}
  .ing input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px}
  .ing li.done span{text-decoration:line-through;color:var(--soft)}
  .step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border:0}
  .num{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .media{width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-top:8px;background:#000}
  .scaler{display:flex;align-items:center;gap:8px}
  .scaler button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800}
  label.f{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
  .in{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
  textarea.in{min-height:70px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .estep{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:var(--bg)}
  .estep .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
  .thumb{margin-top:8px;max-width:100%;max-height:180px;border-radius:10px;display:block}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .notice{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--soft);margin:10px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .stat{padding:14px;text-align:center}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:2rem;color:var(--accent)}
  .stat small{color:var(--soft);font-size:.8rem}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal div{aspect-ratio:1;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--soft)}
  .cal div.on{background:var(--accent);color:#fff;font-weight:700}
  .cal div.today{outline:2px solid var(--accent2)}
  .cal .dn{background:none;font-weight:700}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .bdg{padding:12px;text-align:center;opacity:.35}
  .bdg.got{opacity:1}
  .bdg span{font-size:2rem;display:block}
  .bdg small{font-size:.78rem;color:var(--soft)}
  /* mod gătit */
  #cook{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column}
  #cook.on{display:flex}
  .cook-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .bar{height:6px;background:var(--chip)}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .cook-body{flex:1;overflow:auto;padding:18px 16px;max-width:760px;margin:0 auto;width:100%}
  .cook-body .big{font-size:1.25rem;line-height:1.6;margin:12px 0}
  .cook-body .media{max-height:48vh}
  .timer{font-family:'Fraunces',serif;font-size:2.4rem;text-align:center;margin:10px 0}
  .cook-nav{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .cook-nav .btn{flex:1;padding:14px}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  .prod{padding:16px;margin-bottom:12px}
  .prod h3{font-size:1.15rem}
  .price{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--accent)}
  .pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
  .pick label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:.92rem}
  .empty{text-align:center;color:var(--soft);padding:30px 10px}
  video.gif{cursor:pointer}
  /* feed Descoperă */
  #v-feed.on{position:fixed;left:0;right:0;top:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;background:#000;padding:0}
  .feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
  .feed::-webkit-scrollbar{display:none}
  .fcard{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff;user-select:none}
  .fcard .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
  .fcard .layer.on{opacity:1;animation:kbf 7s ease-out forwards}
  @keyframes kbf{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.14) translate(-1.5%,-1.5%)}}
  .fcard .ph{position:absolute;inset:0;aspect-ratio:auto;font-size:7rem}
  .fshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);pointer-events:none}
  .ftop{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center;font-weight:700;z-index:2}
  .ftop .streak-pill{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(8px)}
  .fdots{position:absolute;left:16px;right:76px;top:calc(52px + env(safe-area-inset-top));display:flex;gap:4px;z-index:2}
  .fdots i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
  .fdots i.on{background:#fff}
  .finfo{position:absolute;left:16px;right:80px;bottom:20px;z-index:2}
  .finfo .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .finfo .tagline span{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:99px;padding:3px 10px;font-size:.78rem;font-weight:700}
  .finfo h2{font-size:1.75rem;line-height:1.15;text-shadow:0 2px 14px rgba(0,0,0,.5);margin-bottom:6px}
  .finfo p{font-size:.95rem;opacity:.95;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .finfo .fstep{margin-top:8px;font-size:.88rem;background:rgba(0,0,0,.35);border-radius:10px;padding:6px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .frail{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:14px;z-index:2}
  .frail button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .frail button span{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:1.5rem;transition:transform .15s}
  .frail button:active span{transform:scale(.88)}
  .frail .liked span{background:#e8603c}
  .fheart{position:absolute;left:50%;top:45%;font-size:6rem;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:3}
  .fheart.pop{animation:pop2 .8s ease-out}
  @keyframes pop2{0%{transform:translate(-50%,-50%) scale(0);opacity:1}40%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
  .fhint{position:absolute;left:0;right:0;top:calc(66px + env(safe-area-inset-top));text-align:center;font-size:.78rem;font-weight:700;opacity:.85;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.6);animation:hint 2.4s ease-in-out infinite}
  @keyframes hint{50%{transform:translateY(-4px)}}
  .fend{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:linear-gradient(135deg,#f4a340,#e8603c)}
  @media (prefers-reduced-motion:reduce){.fcard .layer.on{animation:none}.fhint{animation:none}}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
  .kpi{padding:12px 14px}
  .kpi b{display:block;font-family:'Fraunces',serif;font-size:1.6rem;color:var(--accent);line-height:1.1}
  .kpi small{color:var(--soft);font-size:.78rem}
  .bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px}
  .bars i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .bars i:hover{opacity:1}
  .comment{padding:10px 0;border-bottom:1px dashed var(--line)}
  .comment:last-child{border:0}
  .comment b{font-size:.9rem}
  .premium-badge{display:inline-block;background:linear-gradient(135deg,#f4a340,#e8603c);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:800}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:none;align-items:flex-end}
  .sheet.on{display:flex}
  .sheet-card{width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .linkbox{display:flex;gap:6px;margin:10px 0}
  .linkbox input{flex:1;min-width:0;font-size:.85rem}
  /* animație rețetă */
  #anim{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;color:#fff}
  #anim.on{display:flex}
  #anim.paused *{animation-play-state:paused!important}
  .anim-stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .anim-stage img,.anim-stage video{width:100%;height:100%;object-fit:cover}
  .anim-stage img.kb{animation:kb 3.2s ease-out forwards}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
  .anim-card{font-size:6rem;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f4a340,#e8603c);animation:pop .5s ease-out}
  .anim-card b{font-family:'Fraunces',serif;font-size:1.6rem;text-align:center;padding:0 20px}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  .anim-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 22px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:1.08rem;animation:pop .5s ease-out}
  .anim-cap .num{display:inline-flex;margin-right:8px;vertical-align:middle}
  .anim-dots{display:flex;gap:4px;padding:10px 14px}
  .anim-dots i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
  .anim-dots i.done{background:#fff}
  .anim-dots i.cur::after{content:'';display:block;height:100%;background:#fff;animation:fill var(--d,3s) linear forwards}
  @keyframes fill{from{width:0}to{width:100%}}
  .anim-bar{display:flex;gap:8px;justify-content:space-between;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  @media (prefers-reduced-motion:reduce){.anim-stage img.kb,.anim-card,.anim-cap{animation:none}}
  @media(max-width:560px){.two,.three{grid-template-columns:1fr}.detail-head h1{font-size:1.5rem}}
  /* glisare Tinder în feed */
  .fcard{touch-action:pan-y}
  .fswipe{position:absolute;top:28%;z-index:4;font-weight:900;font-size:1.5rem;padding:6px 14px;border:4px solid;border-radius:14px;opacity:0;pointer-events:none;background:rgba(0,0,0,.25)}
  .fswipe.yes{left:18px;color:#4ade80;border-color:#4ade80;transform:rotate(-12deg)}
  .fswipe.no{right:18px;color:#fca5a5;border-color:#fca5a5;transform:rotate(12deg)}
  /* listă de cumpărături */
  ul.shop{list-style:none;padding:0;margin:0}
  ul.shop li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
  ul.shop li:last-child{border:0}
  ul.shop li span{flex:1;min-width:0}
  ul.shop li.done span{text-decoration:line-through;opacity:.5}
  ul.shop input,.prep input{width:24px;height:24px;flex:none;accent-color:var(--accent)}
  .shop-x{border:0;background:none;color:var(--soft);font-size:1.1rem;cursor:pointer;padding:4px 8px}
  .imp{border:2px dashed var(--accent)}
  /* MOD UȘOR: text mare, o acțiune pe ecran, fără animații bruște */
  html.easy{font-size:19px}
  html.easy *,html.easy *::before,html.easy *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  html.easy .big{font-size:1.65rem;line-height:1.5}
  html.easy .btn{min-height:54px;font-size:1.05rem}
  html.easy ul.shop input,html.easy .prep input{width:34px;height:34px}
  html.easy .fhint{display:none}
  html.easy .cook-body{max-width:640px;margin:0 auto}
  /* catalogul mondial */
  .wbanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;border:0;margin:6px 0 14px;background:linear-gradient(135deg,#f4a340,#e8603c);color:#fff;font:inherit}
  .wbanner b{display:block;font-family:'Fraunces',serif;font-size:1.15rem}
  .wbanner small{opacity:.92}
  .wbanner .globe{font-size:2.4rem}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 24px}
  .ctile{padding:14px;cursor:pointer;text-align:left;border:0;font:inherit;color:inherit}
  .ctile .fl{font-size:2.2rem;line-height:1}
  .ctile b{display:block;margin-top:6px}
  .ctile small{color:var(--soft)}
  .easy-tag{display:inline-block;background:var(--accent);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:800}
</style>
</head>
<body>

<header class="top">
  <div class="logo">Pas cu Gust<small>Rețetele tale, cu poze și video</small></div>
  <div class="row">
    <button class="streak-pill" id="pill" title="Seria ta de gătit">🔥 <span id="pillN">0</span></button>
    <button class="streak-pill" id="shopBtn" title="Lista de cumpărături">🛒<span id="shopN"></span></button>
    <button class="streak-pill" id="themeBtn" title="Temă">🌗</button>
    <button class="streak-pill" id="accBtn" title="Cont și sincronizare">☁️ <span id="accDot"></span></button>
  </div>
</header>

<main class="wrap">

  <!-- ACASĂ -->
  <section class="view on" id="v-home">

/* ---------- IndexedDB pentru poze/video ---------- */
let dbP = null;
function db(){
  if(dbP) return dbP;
  dbP = new Promise((res,rej)=>{
    const r = indexedDB.open('recikeep_media',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('m');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
  return dbP;
}
async function putMedia(blob){
  const id = 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const d = await db();
  await new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});
  return id;
}
async function putMediaId(id,blob){
  const d = await db();
  await new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);});
}
async function getMedia(id){
  if(!id) return null;
  if(isAsset(id)){ try{ const r=await fetch(id); return r.ok?await r.blob():null; }catch(e){ return null; } }
  try{
    const d = await db();
    return await new Promise(res=>{const q=d.transaction('m').objectStore('m').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});
  }catch(e){return null;}
}
async function delMedia(id){
  if(!id) return;
  try{const d=await db();d.transaction('m','readwrite').objectStore('m').delete(id);}catch(e){}
}
const urlCache = {};
async function mediaURL(id){
  if(!id) return null;
  if(/^https:\/\//.test(id) || isAsset(id)) return id; // poze din rețetele distribuite / pozele aplicației
  if(urlCache[id]) return urlCache[id];
  const b = await getMedia(id);
  if(!b) return null;
  return urlCache[id] = URL.createObjectURL(b);
}
// Completează asincron toate elementele cu data-media="id"
async function hydrate(root){
  for(const el of root.querySelectorAll('[data-media]')){
    const u = await mediaURL(el.dataset.media);
    if(u) el.src = u; else el.remove();
  }
}

const today = ()=> dkey(new Date());

/* ---------- serie (streak) ---------- */
function streak(){
  const days = new Set(Object.keys(S.log).filter(k=>S.log[k]?.length));
  let cur=0, d=new Date();
  if(!days.has(dkey(d))) d.setDate(d.getDate()-1); // seria rămâne vie până la finalul zilei de azi
  while(days.has(dkey(d))){cur++;d.setDate(d.getDate()-1);}
  // cea mai lungă serie
  const sorted=[...days].sort(); let best=0,run=0,prev=null;
  for(const k of sorted){
    const t=new Date(k+'T12:00:00');
    run = prev && (t-prev)/864e5<1.5 ? run+1 : 1;
    best=Math.max(best,run); prev=t;
  }
  const total = Object.values(S.log).reduce((a,v)=>a+(v?.length||0),0);
  return {cur,best,total,days,cookedToday:days.has(today())};
}
function markCooked(id){
  track('cooked',byId(id));
  const k=today(); S.log[k]=S.log[k]||[];
  const before=streak().cur;
  S.log[k].push(id); save();
  const st=streak();
  const nb=BADGES.find(b=>b.n===st.cur && b.n>before);
  toast(nb ? `${nb.e} Insignă nouă: ${nb.t}!` : `🔥 Serie: ${st.cur} ${st.cur===1?'zi':'zile'}`);
  refreshPill();
}

    : 'Gătește o rețetă ca să-ți aprinzi seria.';
}

function renderHome(){

  const q=$('#q').value.trim().toLowerCase();
  const items=S.recipes.filter(r=>{
    if(curCat==='❤️ Favorite' && !r.fav) return false;
    if(curCat!=='Toate' && curCat!=='❤️ Favorite' && r.cat!==curCat) return false;
    if(!q) return true;
    return (r.title+' '+r.desc+' '+r.ingredients.join(' ')).toLowerCase().includes(q);
  });
  const L=$('#list');
  if(!items.length){L.innerHTML=`<div class="empty" style="grid-column:1/-1">Nicio rețetă aici încă.<br><br><button class="btn" onclick="go('edit')">➕ Adaugă prima rețetă</button></div>`;return;}
  L.innerHTML=items.map(r=>{
    const media=r.steps.filter(s=>s.media);
    const vids=media.filter(s=>s.mediaType==='video').length, pics=media.length-vids;
    return `<div class="card rcard" data-id="${r.id}">
      ${r.cover?`<img class="cover" data-media="${r.cover}" alt="">`:`<div class="ph">${esc(r.emoji||'🍽️')}</div>`}

        <div style="margin-top:6px"><span class="badge">${esc(r.cat)}</span></div>
      </div></div>`;
  }).join('');
  L.querySelectorAll('.rcard').forEach(c=>c.onclick=()=>go('detail',c.dataset.id));
  hydrate(L);
}

// O rețetă pe ecran; pozele pașilor se derulează singure, ca un clip. Glisezi în sus pentru următoarea.
const flagOf=cc=>String.fromCodePoint(...[...cc.toUpperCase()].map(c=>127397+c.charCodeAt(0)));
const countryOf=r=>r.country||(SEED.some(x=>x.id===r.id)&&!r.imported?'RO':null);
const FLAG_OF=r=>{ const c=countryOf(r); return c?flagOf(c):''; };
let feedTimer=null, feedObs=null, feedCur=null;
let feedFilter=null; // cod de țară, când vii din catalogul mondial
function feedOrder(){
  // amestec stabil pe zi: azi vezi aceeași ordine, mâine alta
  const day=today(), h=x=>{let v=0;for(const c of day+x)v=(v*31+c.charCodeAt(0))|0;return v;};
  const saved=new Set(S.recipes.map(r=>r.from).filter(Boolean));
  const all=[...S.recipes,...WORLD.filter(w=>!saved.has(w.id)).map(w=>worldById(w.id))];
  return all.filter(r=>!feedFilter||countryOf(r)===feedFilter).sort((a,b)=>h(a.id)-h(b.id));
}

      ${layers.length>1?`<div class="fdots">${layers.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}
      <div class="fheart">❤️</div>

        <h2 class="nt">${esc(r.title)}</h2>
        <p class="nt">${esc(r.desc)}</p>
        <div class="fstep nt" hidden></div>
      </div>
      <div class="frail">
        <button data-act="fav" class="${r.fav?'liked':''}"><span>❤️</span>Salvează</button>
        <button data-act="cook"><span>👩‍🍳</span>Gătește</button>

    <article class="fcard fend"><div style="font-size:4rem">🌍</div><h2 style="margin:10px 0">Ai văzut tot! Adaugă o rețetă de-a ta sau revino mâine.</h2>

    if(act==='cook') openCook(id);
    if(act==='anim') openAnim(id);
    if(act==='sound'){ feedSound=!feedSound; F.querySelectorAll('[data-act=sound] span').forEach(s=>s.textContent=feedSound?'🔊':'🔇');

    if(e.target.closest('[data-act]') || Date.now()-swipedAt<400) return;
    const card=e.target.closest('.fcard[data-id]'); if(!card) return;

    else lastTap=now;
  });
  bindSwipe(F);
  feedObs?.disconnect();
  feedObs=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting && en.intersectionRatio>.6) playCard(en.target); }),{root:F,threshold:[.6]});
  F.querySelectorAll('.fcard[data-id]').forEach(c=>feedObs.observe(c));
  hydrate(F);
}
// Glisare ca pe Tinder: dreapta = salvez, stânga = sar peste. Sus/jos rămâne derularea.
let swipedAt=0;
function swipeStyle(card,dx){
  card.style.transform=dx?`translateX(${dx}px) rotate(${S.easy?0:dx/25}deg)`:'';
  const [y,n]=card.querySelectorAll('.fswipe'); if(y){ y.style.opacity=Math.max(0,Math.min(1,dx/90)); n.style.opacity=Math.max(0,Math.min(1,-dx/90)); }
}
function swipeDecide(card,like){
  const r=byId(card.dataset.id);
  if(like){ if(r?._world) likeWorld(r); else { if(r && !r.fav){ r.fav=true; save(); track('save',r); } toast('❤️ Salvată la favorite'); } card.querySelector('[data-act=fav]')?.classList.add('liked'); }
  else toast('👋 Sar peste');
  card.style.transition=S.easy?'none':'transform .22s ease-out';
  card.style.transform=`translateX(${like?130:-130}%)`;
  setTimeout(()=>{
    card.nextElementSibling?.scrollIntoView({behavior:S.easy?'auto':'smooth'});
    setTimeout(()=>{ card.style.transition='none'; swipeStyle(card,0); requestAnimationFrame(()=>card.style.transition=''); },450);
  },S.easy?0:200);
}
function bindSwipe(F){
  let sw=null;
  F.addEventListener('pointerdown',e=>{
    if(e.target.closest('[data-act]') || e.button>0) return;
    const card=e.target.closest('.fcard[data-id]'); if(!card) return;
    sw={card,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId};
  });
  F.addEventListener('pointermove',e=>{
    if(!sw || e.pointerId!==sw.id) return;
    const dx=e.clientX-sw.x, dy=e.clientY-sw.y;
    if(!sw.on){
      if(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.3) sw.on=true;
      else { if(Math.abs(dy)>14) sw=null; return; }
    }
    sw.dx=dx; swipeStyle(sw.card,dx);
  });
  F.addEventListener('pointerup',()=>{
    const s=sw; sw=null; if(!s?.on) return;
    swipedAt=Date.now();
    if(Math.abs(s.dx)>90) swipeDecide(s.card,s.dx>0); else swipeStyle(s.card,0);
  });
  F.addEventListener('pointercancel',()=>{ if(sw){ swipeStyle(sw.card,0); sw=null; } });
}
function heartPop(card){ const h=card.querySelector('.fheart'); h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop'); }
async function shareFeed(r){ // fără cont: link rapid doar cu text
  try{ await shareLink(appBase()+'#p='+await packText(r), r.title); }catch(e){ openShare(r.id); }
}
function playCard(card){
  if(feedCur===card) return;
  stopFeed(); feedCur=card;
  const r=byId(card.dataset.id); if(!r) return;
  track('feed_view',r);
  const vidEl=card.querySelector('video.fvid'), vid=videoOf(r);
  if(vidEl && vid){ // clip: textul pasului urmează vocea
    const dots=[...card.querySelectorAll('.fdots i')], cap=card.querySelector('.fstep'), n=r.steps.length;
    vidEl.muted=!feedSound; vidEl.currentTime=0; vidEl.play().catch(()=>{});
    vidEl.ontimeupdate=()=>{
      let seg=0; vid.cues.forEach((c,i)=>{ if(vidEl.currentTime>=c) seg=i; });
      dots.forEach((d,i)=>d.classList.toggle('on',i<=seg));
      const k=seg-1; // 0 = copertă, 1..n = pașii, n+1 = final
      if(k>=0 && k<n){ cap.hidden=false; const tx=`${k+1}. ${r.steps[k].text}`; if(cap.textContent!==tx) cap.textContent=tx; } else cap.hidden=true;
    };
    return;
  }
  const layers=[...card.querySelectorAll('.layer')], dots=[...card.querySelectorAll('.fdots i')], cap=card.querySelector('.fstep');
  const stepOf=i=>{ const m=layers[i]?.dataset.media; const k=r.steps.findIndex(s=>s.media===m); return k<0?null:k; };
  let i=0;
  const show=n=>{
    layers.forEach((l,k)=>{ const on=k===n; if(on){ l.classList.remove('on'); void l.offsetWidth; } l.classList.toggle('on',on);
      if(l.tagName==='VIDEO'){ if(on) l.play().catch(()=>{}); else l.pause(); } });
    dots.forEach((d,k)=>d.classList.toggle('on',k<=n));
    const k=stepOf(n);
    if(k==null){ cap.hidden=true; } else { cap.hidden=false; cap.textContent=`${k+1}. ${r.steps[k].text}`; }
  };
  show(0);
  if(layers.length>1) feedTimer=setInterval(()=>{ i=(i+1)%layers.length; show(i); },2600);
}
function stopFeed(){
  clearInterval(feedTimer); feedTimer=null;
  feedCur?.querySelectorAll('video').forEach(v=>{ v.pause(); v.ontimeupdate=null; });
  feedCur=null;
}

// Clipul gata de pus pe TikTok / Instagram / WhatsApp: pe telefon se deschide meniul de partajare.
async function shareVideo(r){
  track('video',r);
  const v=videoOf(r); if(!v) return;
  try{
    const blob=await (await fetch(v.src)).blob(), name=slug(r.title)+'.mp4';
    const file=new File([blob],name,{type:'video/mp4'});
    if(navigator.canShare?.({files:[file]}) && matchMedia('(pointer:coarse)').matches){
      try{ await navigator.share({files:[file],title:r.title,text:t(`Rețeta „${r.title}” pe Pas cu Gust`)+' '+appBase()}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    download(blob,name); toast('✅ Video salvat');
  }catch(e){ toast('Nu am putut salva clipul'); }
}

let scale=1;
function scaleLine(line,f){
  if(f===1) return line;
  return line.replace(/^(\d+(?:[.,]\d+)?)(?:\/(\d+))?/,(m,a,b)=>{
    let v=parseFloat(a.replace(',','.')); if(b) v=v/parseFloat(b);
    v=Math.round(v*f*100)/100;
    return String(v).replace('.',',');
  });
}

/* ---------- MOD GĂTIT pas cu pas ---------- */
// În modul ușor fiecare pas se împarte în acțiuni mici (o propoziție pe ecran) și începem cu „Ai tot ce îți trebuie?”.
const sentences=t=>{ const a=String(t||'').split(/(?<=[.!?;])\s+(?=\S)/).map(x=>x.trim()).filter(Boolean); return a.length?a:[String(t||'')]; };
function cookList(r){
  const L=[];
  if(S.easy && r.ingredients.length) L.push({prep:true});
  r.steps.forEach((s,k)=>{
    const parts=S.easy?sentences(s.text):[s.text];
    parts.forEach((p,j)=>L.push({text:p,min:j===parts.length-1?s.min:0,media:j===0?s.media:null,mediaType:s.mediaType,k,j,n:parts.length}));
  });
  return L;
}
let ck={id:null,i:0,timer:null,left:0,list:[]};
function openCook(id){ const r=byId(id); track('cook',r); ck={id,i:0,timer:null,left:0,list:cookList(r),have:{}}; $('#cook').classList.add('on'); document.body.style.overflow='hidden'; drawCook(); try{navigator.wakeLock?.request('screen').then(l=>ck.lock=l).catch(()=>{});}catch(e){} }
function closeCook(){ clearInterval(ck.timer); ck.lock?.release?.(); stopSpeak(); $('#cook').classList.remove('on'); document.body.style.overflow=''; }
// citire cu voce, cu vocea telefonului (nimic nu pleacă pe internet)
function speak(text){
  try{ if(!('speechSynthesis' in window)) return toast('Telefonul nu poate citi cu voce');
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=locale(); u.rate=S.easy?.85:1; speechSynthesis.speak(u); }catch(e){}
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }
function drawCook(){
  const r=byId(ck.id), L=ck.list, n=L.length, last=ck.i===n, total=r.steps.length;
  clearInterval(ck.timer); ck.timer=null; stopSpeak();
  $('#cookTitle').textContent=r.title;
  $('#cookSpeak').textContent=S.speak?'🔊':'🔇';
  $('#cookBar').style.width=(ck.i/n*100)+'%';
  $('#cookPrev').disabled=ck.i===0;

function addToShop(lines,from){
  S.shop=S.shop||[]; let n=0;

const LICENSES={own:'Toate drepturile rezervate (autorul)',CCBY:'CC BY 4.0 — liber cu menționarea autorului',CC0:'CC0 — domeniu public, fără drepturi rezervate'};

// Păstrăm doar linkul și creditul; clipul original rămâne la autor (player oficial, încărcat doar la cerere).
function parseInspo(u){
  try{
    const x=new URL(String(u).trim()); if(!/^https?:$/.test(x.protocol)) return null;
    const h=x.hostname.replace(/^(www|m|vm|vt)\./,'');
    if(/(^|\.)tiktok\.com$/.test(h)){ const id=x.pathname.match(/\/video\/(\d{5,25})/)?.[1]; return {platform:'TikTok',url:x.href,embed:id?`https://www.tiktok.com/embed/v2/${id}`:null}; }
    if(h==='instagram.com'){ const m=x.pathname.match(/\/(p|reel|tv)\/([\w-]{5,40})/); return {platform:'Instagram',url:x.href,embed:m?`https://www.instagram.com/${m[1]}/${m[2]}/embed`:null}; }
    if(h==='youtube.com'||h==='youtu.be'){ const id=(h==='youtu.be'?x.pathname.slice(1):(x.searchParams.get('v')||x.pathname.match(/\/shorts\/([\w-]+)/)?.[1]))||''; return {platform:'YouTube',url:x.href,embed:/^[\w-]{6,20}$/.test(id)?`https://www.youtube-nocookie.com/embed/${id}`:null}; }
    return {platform:h,url:x.href,embed:null};
  }catch(e){ return null; }
}
const firstUrl=s=>String(s||'').match(/https?:\/\/\S+/)?.[0]||'';
const INSPO_ICON={TikTok:'🎵',Instagram:'📸',YouTube:'▶️'};
function inspoCard(r){

    <p class="meta" style="margin-bottom:10px">${INSPO_ICON[p.platform]||'🔗'} <a href="${esc(p.url)}" target="_blank" rel="noopener nofollow" style="color:var(--accent)" class="nt">${esc(p.platform)}${r.inspo.author?' · '+esc(r.inspo.author):''}</a></p>
    ${p.embed?`<button class="btn ghost sm" id="inspoPlay">▶ Arată clipul original</button><div id="inspoFrame"></div>
      <p class="meta" style="margin-top:8px">Clipul se încarcă de pe ${esc(p.platform)} doar când apeși.</p>`:''}</div>`;
}

async function importLink(url){
  const c=cloudCfg()||RK_CLOUD_DEFAULT;
  const res=await fetch(c.url+'/functions/v1/import-recipe',{method:'POST',headers:{'Content-Type':'application/json',apikey:c.key,Authorization:'Bearer '+c.key},body:JSON.stringify({url})});
  const j=await res.json().catch(()=>({}));
  if(!j.ok) throw new Error(j.reason||'server');
  return j.data;
}

function drawSteps(){
  const W=$('#eSteps');
  W.innerHTML=draft.steps.map((s,k)=>`<div class="estep" data-k="${k}">
    <div class="hd"><span>Pasul ${k+1}</span><span class="row">
      <button class="btn ghost sm" data-a="up" ${k===0?'disabled':''}>↑</button>
      <button class="btn ghost sm" data-a="down" ${k===draft.steps.length-1?'disabled':''}>↓</button>
      <button class="btn ghost sm" data-a="del" ${draft.steps.length===1?'disabled':''}>🗑</button></span></div>
    <textarea class="in" placeholder="Descrie ce se face la acest pas…">${esc(s.text)}</textarea>
    <div class="row" style="margin-top:8px">
      <label class="meta">⏲ Cronometru (min) <input type="number" min="0" class="in" style="width:80px;display:inline-block;padding:6px 8px" value="${s.min||0}"></label>
      <span class="btn ghost sm file-btn">📷 Poză / GIF<input type="file" accept="image/*" data-a="img"></span>
      <span class="btn ghost sm file-btn">🎬 Video<input type="file" accept="video/*" data-a="vid"></span>
      ${s.media?'<button class="btn ghost sm" data-a="rm">✕ Scoate media</button>':''}
    </div>
    ${s.media?(s.mediaType==='video'?`<video class="thumb" controls playsinline preload="metadata" data-media="${s.media}"></video>`:`<img class="thumb" data-media="${s.media}">`):''}
  </div>`).join('');
  W.querySelectorAll('.estep').forEach(el=>{
    const k=+el.dataset.k;
    el.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{
      syncDraft(); const a=b.dataset.a, st=draft.steps;
      if(a==='up'){[st[k-1],st[k]]=[st[k],st[k-1]];}
      if(a==='down'){[st[k+1],st[k]]=[st[k],st[k+1]];}
      if(a==='del'){st.splice(k,1);}
      if(a==='rm'){st[k].media=null;st[k].mediaType=null;}
      drawSteps();
    });
    el.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      const isVid=inp.dataset.a==='vid';
      if(isVid && f.size>50*1024*1024){toast('Clip prea mare (max 50 MB) — filmează scurt, ca un GIF');return;}
      toast(isVid?'Se salvează clipul…':'Se salvează poza…');
      syncDraft();
      const id=await putMedia(isVid?f:await shrink(f)); draft._new.push(id);
      draft.steps[k].media=id; draft.steps[k].mediaType=isVid?'video':'image';
      drawSteps(); hydrate(W);
    });
  });
  hydrate(W);
}
// micșorează pozele mari ca să nu umple memoria
function shrink(file,max=1600){
  return new Promise(res=>{
    if(file.type==='image/gif') return res(file); // păstrăm animația GIF
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      if(k===1 && file.size<1.5e6){URL.revokeObjectURL(u);return res(file);}
      const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); c.toBlob(b=>res(b||file),'image/jpeg',.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);res(file);};
    img.src=u;
  });
}
function saveDraft(){
  syncDraft();
  if(!draft.title) return toast('Pune un titlu rețetei');
  if(!draft.steps.some(s=>s.text)) return toast('Adaugă cel puțin un pas');
  if(!draft._ok) return toast('Bifează confirmarea de originalitate');
  draft.steps=draft.steps.filter(s=>s.text||s.media);
  const used=new Set([draft.cover,...draft.steps.map(s=>s.media)].filter(Boolean));
  [...draft._orig,...draft._new].forEach(m=>{if(!used.has(m)) delMedia(m);});
  if(draft._badInspo) return toast('Linkul de inspirație nu e valid');
  const {_orig,_new,_ok,_badInspo,...clean}=draft; clean.updated=Date.now();
  if(clean.id){ S.recipes=S.recipes.map(x=>x.id===clean.id?{...x,...clean}:x); }
  else { clean.id=uid(); clean.created=Date.now(); S.recipes.unshift(clean); }
  save(); toast('✅ Rețetă salvată'); go('detail',clean.id);
}

async function exportBackup(){
  toast('Se pregătește backup-ul…');

async function importBackup(e){
  const f=e.target.files[0]; if(!f) return;
  try{
    const j=JSON.parse(await f.text());
    if(j.app!=='pascugust' && j.app!=='recikeep') throw 0; // acceptă și backup-urile vechi
    if(!confirm('Înlocuiești datele actuale cu cele din backup?')) return;
    const d=await db();
    for(const [id,data] of Object.entries(j.media||{})){
      const b=await (await fetch(data)).blob();
      await new Promise(res=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(b,id);t.oncomplete=res;t.onerror=res;});
    }
    S=j.data; save(); applyTheme(); applyEasy(); updShop(); refreshPill(); toast('✅ Backup importat'); go('home');
  }catch(err){toast('Fișier de backup invalid');}
}

// slide 0 = titlu, 1..n = pași, n+1 = final
async function animStep(i){
  const r=byId(an.id); if(!r) return closeAnim();
  const n=r.steps.length;
  clearTimeout(an.t);
  if(i<0) i=0;
  if(i>n+1) i=0;
  an.i=i;
  $('#animDots').innerHTML=Array.from({length:n+2},(_,k)=>`<i class="${k<i?'done':k===i?'cur':''}" style="--d:${AN_MS}ms"></i>`).join('');
  const St=$('#animStage');
  if(i===0){
    St.innerHTML = r.cover
      ? `<img class="kb" data-media="${r.cover}" alt=""><div class="anim-cap"><b style="font-family:Fraunces,serif;font-size:1.5rem">${esc(r.title)}</b><br>${t(`${r.steps.length} pași · ${fmtTime(r.time)||''}`)}</div>`
      : `<div class="anim-card">${esc(r.emoji||'🍽️')}<b>${esc(r.title)}</b></div>`;
  } else if(i===n+1){
    St.innerHTML=`<div class="anim-card">🎉<b>Poftă bună!</b></div>`;
  } else {
    const s=r.steps[i-1];
    const m = s.media ? (s.mediaType==='video'
        ? `<video autoplay muted loop playsinline data-media="${s.media}"></video>`
        : `<img class="kb" data-media="${s.media}" alt="">`)
      : `<div class="anim-card">${esc(r.emoji||'🍽️')}<b>Pasul ${i}</b></div>`;
    St.innerHTML = m + `<div class="anim-cap"><span class="num">${i}</span><span class="nt">${esc(s.text)}</span></div>`;
  }
  await hydrate(St);
  if(an.i===i && !an.paused && $('#anim').classList.contains('on')) an.t=setTimeout(()=>animStep(i+1),AN_MS);
}
$('#animClose').onclick=closeAnim;
$('#animPause').onclick=()=>{
  an.paused=!an.paused;
  $('#anim').classList.toggle('paused',an.paused);
  $('#animPause').textContent=an.paused?'▶ Continuă':'⏸ Pauză';
  if(an.paused) clearTimeout(an.t); else animStep(an.i);
};
$('#animStage').onclick=e=>{ const w=e.currentTarget.clientWidth; animStep(e.offsetX<w/3 ? an.i-1 : an.i+1); };
$('#animGif').onclick=()=>exportGif(an.id,$('#animGif'));

const loadImg=src=>new Promise((res,rej)=>{const i=new Image();if(/^https:/.test(src))i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src;});
const loadVid=src=>new Promise((res,rej)=>{const v=document.createElement('video');if(/^https:/.test(src))v.crossOrigin='anonymous';v.muted=true;v.playsInline=true;v.preload='auto';v.onloadeddata=()=>res(v);v.onerror=rej;v.src=src;});
const seek=(v,t)=>new Promise(res=>{const done=()=>{clearTimeout(h);res();};const h=setTimeout(res,1500);v.addEventListener('seeked',done,{once:true});v.currentTime=t;});

// Creează un GIF animat cu toți pașii rețetei (480×480), bun pentru Instagram, TikTok, WhatsApp.
async function exportGif(id,btn){
  track('gif',byId(id));
  const r=byId(id); if(!r) return;
  const old=btn?.textContent; if(btn){btn.disabled=true;btn.textContent='⏳ Se creează…';}
  try{
    const {GIFEncoder,quantize,applyPalette}=await import('./vendor/gifenc.esm.js');
    const W=480,H=480,c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d',{willReadFrequently:true});
    const gif=GIFEncoder();
    const add=delay=>{const d=x.getImageData(0,0,W,H).data;const pal=quantize(d,256);gif.writeFrame(applyPalette(d,pal),W,H,{palette:pal,delay});};
    const wrap=(text,maxW,maxL)=>{
      const out=[]; let line='';
      for(const w of text.split(/\s+/)){
        const t=line?line+' '+w:w;
        if(x.measureText(t).width>maxW && line){out.push(line);line=w;} else line=t;
      }
      if(line) out.push(line);
      if(out.length>maxL){out.length=maxL;out[maxL-1]=out[maxL-1].replace(/\s*\S*$/,'')+'…';}
      return out;
    };
    const bg=()=>{const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f4a340');g.addColorStop(1,'#e8603c');x.fillStyle=g;x.fillRect(0,0,W,H);};
    const card=(emoji,title,sub)=>{
      bg(); x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#fff';
      x.font='130px serif'; x.fillText(emoji,W/2,H*.38);
      x.font='800 34px Fraunces, Georgia, serif';
      wrap(title,W-60,3).forEach((l,k)=>x.fillText(l,W/2,H*.66+k*40));
      if(sub){x.font='600 18px Inter, sans-serif';x.globalAlpha=.85;x.fillText(sub,W/2,H-34);x.globalAlpha=1;}
    };
    const cover=(src,z)=>{
      const sw=src.videoWidth||src.naturalWidth, sh=src.videoHeight||src.naturalHeight;
      const k=Math.max(W/sw,H/sh)*z, dw=sw*k, dh=sh*k;
      x.fillStyle='#000'; x.fillRect(0,0,W,H); x.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
    };
    const caption=(num,text)=>{
      x.font='600 19px Inter, sans-serif'; x.textAlign='left'; x.textBaseline='alphabetic';
      const lines=wrap(text,W-(num?96:40),4), h=lines.length*25+34;
      const g=x.createLinearGradient(0,H-h-40,0,H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.35,'rgba(0,0,0,.75)'); g.addColorStop(1,'rgba(0,0,0,.9)');
      x.fillStyle=g; x.fillRect(0,H-h-40,W,h+40);
      const left=num?72:20;
      if(num){
        x.fillStyle='#e8603c'; x.beginPath(); x.arc(40,H-h+22,20,0,Math.PI*2); x.fill();
        x.fillStyle='#fff'; x.font='800 20px Inter, sans-serif'; x.textAlign='center'; x.fillText(num,40,H-h+29);
        x.textAlign='left'; x.font='600 19px Inter, sans-serif';
      }
      x.fillStyle='#fff'; lines.forEach((l,k)=>x.fillText(l,left,H-h+28+k*25));
    };
    // titlu
    const cv = r.cover && await loadImg(await mediaURL(r.cover)).catch(()=>null);
    if(cv){ for(let f=0;f<4;f++){cover(cv,1+f*.02);caption(0,r.title);add(400);} }
    else { card(r.emoji||'🍽️',r.title,t(`${r.steps.length} pași · Pas cu Gust`)); add(1600); }
    // pași
    for(const [k,s] of r.steps.entries()){
      if(btn) btn.textContent=`⏳ Pasul ${k+1}/${r.steps.length}`;
      const u = s.media && await mediaURL(s.media);
      if(u && s.mediaType==='video'){
        const v=await loadVid(u).catch(()=>null);
        if(v){ const dur=v.duration||2; for(let f=0;f<10;f++){await seek(v,Math.min(Math.max(0,dur-.05),f*.25));cover(v,1);caption(k+1,s.text);add(250);} continue; }
      }
      if(u){
        const im=await loadImg(u).catch(()=>null);
        if(im){ for(let f=0;f<5;f++){cover(im,1+f*.015);caption(k+1,s.text);add(440);} continue; }
      }
      card(r.emoji||'🍽️',t('Pasul '+(k+1))); caption(k+1,s.text); add(2400);
    }
    card('🎉',t('Poftă bună!'),t(r.author?'Rețetă de '+r.author:'Creat cu Pas cu Gust')); add(1800);
    gif.finish();
    const blob=new Blob([gif.bytes()],{type:'image/gif'}), name=slug(r.title)+'.gif';
    const file=new File([blob],name,{type:'image/gif'});
    if(navigator.canShare?.({files:[file]}) && matchMedia('(pointer:coarse)').matches){
      try{ await navigator.share({files:[file],title:r.title}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    download(blob,name); toast('✅ GIF salvat');
  }catch(e){ console.error(e); toast('Nu am putut crea GIF-ul'); }
  finally{ if(btn){btn.disabled=false;btn.textContent=old;} }
}

function mergeState(A,B){
  const del={...(B.deleted||{})};
  for(const [k,v] of Object.entries(A.deleted||{})) del[k]=Math.max(del[k]||0,v);
  const ts=o=>o.updated||o.created||0;
  const mergeList=(a=[],b=[])=>{
    const m=new Map();
    [...b,...a].forEach(o=>{const p=m.get(o.id); if(!p||ts(o)>=ts(p)) m.set(o.id,o);}); // la egalitate câștigă local
    return [...m.values()].filter(o=>!(del[o.id]>=ts(o))).sort((x,y)=>(y.created||0)-(x.created||0));
  };
  const log={};
  for(const k of new Set([...Object.keys(A.log||{}),...Object.keys(B.log||{})])){
    const ca={},cb={};
    (A.log?.[k]||[]).forEach(i=>ca[i]=(ca[i]||0)+1);
    (B.log?.[k]||[]).forEach(i=>cb[i]=(cb[i]||0)+1);
    const out=[];
    for(const i of new Set([...Object.keys(ca),...Object.keys(cb)])) for(let n=Math.max(ca[i]||0,cb[i]||0);n>0;n--) out.push(i);
    if(out.length) log[k]=out;
  }
  return {recipes:mergeList(A.recipes,B.recipes),products:mergeList(A.products,B.products),log,deleted:del};
}
async function syncNow(){
  if(!sb||!cloudUser) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; updDot();
  const me=cloudUser.id, errs=[];
  try{
    const {data:row,error:e1}=await sb.from('recikeep_state').select('data').eq('user_id',me).maybeSingle();
    if(e1) throw e1;
    const M=mergeState(S,row?.data||{});
    const used=new Set();
    M.recipes.forEach(r=>[r.cover,...r.steps.map(s=>s.media)].forEach(m=>m&&!isAsset(m)&&used.add(m))); // pozele aplicației nu se copiază în cloud
    const remote=new Map();
    for(let off=0;;off+=1000){
      const {data:fl,error}=await sb.storage.from(BUCKET).list(me,{limit:1000,offset:off});
      if(error) throw error;
      fl.forEach(f=>remote.set(f.name,f));
      if(fl.length<1000) break;
    }
    for(const m of used){
      const local=await getMedia(m);
      if(local && !remote.has(m)){
        const {error}=await sb.storage.from(BUCKET).upload(`${me}/${m}`,local,{contentType:local.type||'application/octet-stream',upsert:true});
        if(error) errs.push(error.message);
      } else if(!local && remote.has(m)){
        const {data:bl,error}=await sb.storage.from(BUCKET).download(`${me}/${m}`);
        if(!error && bl) await putMediaId(m,bl);
      }
    }
    // fișiere orfane (rețete șterse) — doar cele mai vechi de o zi, ca să nu atingem upload-urile altui dispozitiv în curs
    const old=[...remote.values()].filter(f=>!used.has(f.name) && Date.now()-new Date(f.created_at).getTime()>864e5).map(f=>`${me}/${f.name}`);
    if(old.length) await sb.storage.from(BUCKET).remove(old);
    const {error:e2}=await sb.from('recikeep_state').upsert({user_id:me,data:M,updated_at:new Date().toISOString()});
    if(e2) throw e2;
    // îmbinăm din nou cu ce s-a modificat local între timp
    const F=mergeState(S,M); F.theme=S.theme; F.lang=S.lang; F.easy=S.easy; F.speak=S.speak; F.shop=S.shop; S=F;
    localStorage.setItem(KEY,JSON.stringify(S));
    lastSync=new Date(); cloudErr=errs.length?`${errs.length} fișiere nu s-au urcat (${errs[0]})`:'';
    refreshPill();
    if($('#v-home').classList.contains('on')) renderHome();
  }catch(e){ cloudErr=e.message||String(e); }
  finally{
    syncing=false; updDot();
    if(syncAgain){ syncAgain=false; scheduleSync(); }
    if($('#v-account').classList.contains('on')) renderAccount();
  }
}

// Adresa produsului Premium de pe Gumroad (goală până îl publici).

// Statistici anonime: doar numele evenimentului, rețeta de pornire (sau „proprie”) și limba. Fără identificatori.
let evQueue=[], evTimer=null;
function track(name,r,src){
  const recipe=!r?null:r._world?r.id:SEED.some(x=>x.id===r.id)&&!r.imported?r.id:r.from?.startsWith?.('w-')?r.from:r._shareId?'link':'proprie';
  evQueue.push({name,recipe,lang:LANG,src:src||null});
  clearTimeout(evTimer); evTimer=setTimeout(flushEvents,8000);
}
function flushEvents(){
  const c=cloudCfg(); if(!c||!evQueue.length) return;
  const batch=evQueue.splice(0,50);
  fetch(`${c.url}/rest/v1/events`,{method:'POST',keepalive:true,
    headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(batch)}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushEvents(); });
window.addEventListener('pagehide',flushEvents);
window.addEventListener('appinstalled',()=>track('install'));

// Invitații: ?ref=COD se păstrează până când omul își face cont.
(function(){
  const q=new URLSearchParams(location.search), ref=q.get('ref');
  if(ref && /^[a-z0-9]{6,12}$/i.test(ref)){
    try{ localStorage.setItem('pcg_ref',ref.toLowerCase()); }catch(e){}
    track('link_open',null,'invitație');
    q.delete('ref'); history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);

})();
async function loadProfile(){
  if(!sb||!cloudUser) return;
  let pending=null; try{ pending=localStorage.getItem('pcg_ref'); }catch(e){}
  if(pending){
    const {data}=await sb.rpc('claim_referral',{code:pending});
    try{ localStorage.removeItem('pcg_ref'); }catch(e){}
    if(data?.ok) toast('🎁 Bine ai venit! Ai primit 30 de zile Premium');
  }
  if(cloudUser && Date.now()-new Date(cloudUser.created_at).getTime()<10*60*1000) track('signup');
  const [{data:prof},{data:adm}]=await Promise.all([sb.rpc('my_profile'),sb.rpc('is_admin')]);
  PROFILE=prof||null; IS_ADMIN=!!adm;
  if($('#v-account').classList.contains('on')) renderAccount();
}

function bindGrowthAccount(V){
  const sh=V.querySelector('#iShare');
  if(sh) sh.onclick=()=>shareInvite();
  const g=V.querySelector('#aGrowth'); if(g) g.onclick=()=>go('growth');
  const act=V.querySelector('#pAct');
  if(act) act.onclick=async()=>{
    const key=V.querySelector('#pKey').value.trim(); if(!key) return;
    act.disabled=true; act.textContent='⏳';
    try{
      const {data:{session}}=await sb.auth.getSession(), c=cloudCfg();
      const res=await fetch(`${c.url}/functions/v1/premium-verify`,{method:'POST',
        headers:{apikey:c.key,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({license_key:key})});
      const j=await res.json().catch(()=>({}));
      const msg={invalid:'Cheia nu e validă',used:'Cheia e folosită deja pe alt cont',ended:'Abonamentul a expirat',refunded:'Comanda a fost rambursată',not_configured:'Premium nu e încă disponibil',format:'Cheia nu e validă'};
      if(j.ok){ toast('⭐ Premium activat!'); await loadProfile(); }
      else toast('⚠️ '+t(msg[j.reason]||'Nu am putut verifica cheia'));
    }catch(e){ toast('⚠️ '+t('Nu am putut verifica cheia')); }
    act.disabled=false; act.textContent=t('Activează');
  };
}
async function shareInvite(){
  const link=appBase()+'?ref='+PROFILE.ref_code;
  track('share',null,'invitație');
  const text=t('Încearcă Pas cu Gust: rețete pas cu pas, cu poze și video. Cu linkul meu primești 30 de zile Premium gratis!');
  if(navigator.share){ try{ await navigator.share({title:'Pas cu Gust',text,url:link}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text+' '+link); toast('📋 Link copiat'); }catch(e){ toast('Copiază linkul din căsuță'); }
}

// Aprecieri și comentarii la o rețetă distribuită.
async function loadSocial(sid){
  const box=$('#social'); if(!box) return;
  await cloudReady;
  if(!sb){ box.remove(); return; }
  const {data,error}=await sb.rpc('get_social',{share_id:sid});
  if(error||!data){ box.innerHTML='<h2>💬 Comentarii</h2><p class="meta">Comentariile nu se pot încărca acum.</p>'; return; }
  drawSocial(sid,data);
}
function drawSocial(sid,d){
  const box=$('#social'); if(!box) return;
  let name=''; try{ name=localStorage.getItem('pcg_name')||''; }catch(e){}
  box.innerHTML=`<div class="row" style="justify-content:space-between"><h2>💬 Comentarii</h2>
      <button class="btn ${d.liked?'':'ghost'} sm" id="sLike">${d.liked?'❤️':'🤍'} ${d.likes}</button></div>
    ${d.comments.length?d.comments.map(c=>`<div class="comment"><b class="nt">${esc(c.name)}</b> <span class="meta">${new Date(c.at).toLocaleDateString(locale())}</span>
      ${c.can_delete?`<button class="btn ghost sm" data-del="${+c.id}" style="float:right;padding:2px 8px">🗑</button>`:''}
      <div class="nt" style="margin-top:2px">${esc(c.body)}</div></div>`).join(''):'<p class="meta">Niciun comentariu încă. Fii primul!</p>'}
    ${cloudUser?`<div style="margin-top:12px"><input class="in" id="sName" maxlength="40" placeholder="Numele tău" value="${esc(name)}">
      <textarea class="in" id="sBody" maxlength="500" placeholder="Scrie un comentariu…" style="margin-top:6px;min-height:60px"></textarea>
      <button class="btn sm" id="sPost" style="margin-top:6px">💬 Trimite</button></div>`
      :`<p class="meta" style="margin-top:10px">Intră în cont (☁️) ca să apreciezi și să comentezi.</p>`}`;
  box.querySelector('#sLike').onclick=async()=>{
    if(!cloudUser) return toast('Intră în cont (☁️) ca să apreciezi');
    const {data}=await sb.rpc('toggle_like',{share_id:sid}); if(data){ track('like'); drawSocial(sid,data); }
  };
  const post=box.querySelector('#sPost');
  if(post) post.onclick=async()=>{
    const n=box.querySelector('#sName').value.trim(), b=box.querySelector('#sBody').value.trim();
    if(!n||!b) return toast('Scrie numele și comentariul');
    try{ localStorage.setItem('pcg_name',n); }catch(e){}
    const {data,error}=await sb.rpc('post_comment',{share_id:sid,name:n,body:b});
    if(error) return toast(error.message.includes('rate_limit')?'Prea multe comentarii. Încearcă peste o oră.':'⚠️ '+t('Nu am putut trimite comentariul'));
    track('comment'); drawSocial(sid,data);
  };
  box.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{
    if(!confirm('Ștergi comentariul?')) return;
    const {data}=await sb.rpc('delete_comment',{comment_id:+x.dataset.del}); if(data) drawSocial(sid,data);
  });
}

function bars(series,days,since){
  const keys=[...Array(days)].map((_,i)=>{ const d=new Date(since); d.setDate(d.getDate()+i); return dkey(d); });
  const vals=keys.map(k=>+(series?.[k]||0)), max=Math.max(1,...vals);
  return `<div class="bars">${vals.map((v,i)=>`<i style="height:${Math.max(2,v/max*100)}%" title="${keys[i]}: ${v}"></i>`).join('')}</div>`;
}

/* ---------- LINK PUBLIC DE REȚETĂ ---------- */
// Cu cont: rețeta + pozele/clipurile se publică „nelistat” (doar cine are linkul o vede): ?r=ID
// Fără cont: link rapid, doar text, cu rețeta comprimată în adresă: #p=...
const PUBLIC_BASE='https://ahileflo.github.io/creatorhub-live/pascugust/';
// Adresa serverului de previzualizare (share-preview/worker.js). Cât timp e goală, linkurile duc direct în aplicație,
// dar WhatsApp arată doar previzualizarea generală a aplicației, nu poza rețetei.
const RK_SHARE_BASE='';
const shareUrl=id=>RK_SHARE_BASE ? RK_SHARE_BASE.replace(/\/$/,'')+'/r/'+id : appBase()+'?r='+id;
const PUB_BUCKET='pascugust-public';
let SHARED=null;
function appBase(){
  const ok=location.protocol.startsWith('http') && !/claude/.test(location.hostname);
  return ok ? location.origin+location.pathname : PUBLIC_BASE;
}
const shareId=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';return [...crypto.getRandomValues(new Uint8Array(10))].map(x=>a[x%a.length]).join('');};
const pubPrefix=()=>{const c=cloudCfg();return c?`${c.url}/storage/v1/object/public/${PUB_BUCKET}/`:null;};

// Datele dintr-un link vin de la oricine: le validăm și le tăiem la dimensiuni rezonabile.
function cleanShared(o,meta={}){
  const pre=pubPrefix();
  const okUrl=u=>typeof u==='string' && pre && u.startsWith(pre) && /^[\w\-.:/%]+$/.test(u) ? u : null;
  const str=(x,n)=>String(x??'').slice(0,n);
  const steps=(Array.isArray(o.steps)?o.steps:[]).slice(0,100).map(st=>{
    const m=okUrl(st?.media);
    return {text:str(st?.text,3000),min:Math.max(0,Math.min(1440,+st?.min||0)),media:m,mediaType:m?(st.mediaType==='video'?'video':'image'):null};
  });
  return {id:'shared',_shared:true,...meta,
    title:str(o.title,200)||'Rețetă',desc:str(o.desc,1000),cat:CATS.includes(o.cat)?o.cat:'Altele',emoji:str(o.emoji,8)||'🍽️',
    time:Math.max(0,+o.time||0),servings:Math.max(1,Math.min(100,+o.servings||1)),
    ingredients:(Array.isArray(o.ingredients)?o.ingredients:[]).slice(0,200).map(x=>str(x,300)),
    steps:steps.length?steps:[{text:'(rețeta nu are pași)',min:0,media:null,mediaType:null}],
    cover:okUrl(o.cover),author:str(o.author,100),license:LICENSES[o.license]?o.license:'own',
    inspo:o.inspo&&parseInspo(o.inspo.url)?{url:parseInspo(o.inspo.url).url,author:str(o.inspo.author,80)}:null};
}
const b64u=bytes=>{let b='';bytes.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=str=>Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const pipe=async(bytes,t)=>new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(t)).arrayBuffer());
async function packText(r){
  const o={t:r.title,d:r.desc,c:r.cat,e:r.emoji,m:r.time,s:r.servings,i:r.ingredients,p:r.steps.map(x=>[x.text,x.min||0]),a:r.author,l:r.license};
  const raw=new TextEncoder().encode(JSON.stringify(o));
  return window.CompressionStream ? '1'+b64u(await pipe(raw,new CompressionStream('deflate-raw'))) : '0'+b64u(raw);
}
async function unpackText(z){
  const bytes=unb64u(z.slice(1));
  const raw = z[0]==='1' ? await pipe(bytes,new DecompressionStream('deflate-raw')) : bytes;
  const o=JSON.parse(new TextDecoder().decode(raw));
  return cleanShared({title:o.t,desc:o.d,cat:o.c,emoji:o.e,time:o.m,servings:o.s,ingredients:o.i,
    steps:(o.p||[]).map(([text,min])=>({text,min})),author:o.a,license:o.l});
}

async function shareLink(url,title){
  track('share',null,url.includes('?r=')?'link':url.includes('#p=')?'text':'other');
  if(navigator.share){ try{ await navigator.share({title,text:t(`Rețeta „${title}” pe Pas cu Gust`),url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(url); toast('📋 Link copiat'); }catch(e){ toast('Copiază linkul din căsuță'); }
}
function closeSheet(){ $('#sheet').classList.remove('on'); }
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };

function openShare(id){
  const r=byId(id); if(!r) return;
  if(r.source?.url){ shareLink(r.source.url,r.title); return; }
  const link=r.share?shareUrl(r.share.id):null;
  const stale=r.share && (r.updated||r.created||0)>r.share.at;
  const B=$('#sheetBody');
  const box=u=>`<div class="linkbox"><input class="in" readonly value="${esc(u)}" onclick="this.select()"><button class="btn sm" data-copy="${esc(u)}">📤</button></div>`;
  let h=`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><h2 style="flex:1;min-width:0">🔗 Distribuie „${esc(r.title)}”</h2><button class="btn ghost sm" id="shX">✕</button></div>
    <p class="meta">Oricine are linkul vede rețeta, o poate găti pas cu pas și o poate salva, fără cont. Nu apare în nicio listă publică.</p>`;
  if(cloudUser){
    if(link){
      h+=box(link)+(stale?`<div class="notice">✏️ Ai modificat rețeta după ce ai distribuit-o.</div>
        <button class="btn" id="shPub" style="width:100%">⟳ Actualizează linkul</button>`:'')+
        `<button class="btn ghost sm" id="shStop" style="margin-top:10px">🚫 Oprește distribuirea</button>`;
    } else {
      h+=`<button class="btn" id="shPub" style="width:100%;margin-top:6px">🔗 Creează link cu poze și video</button>`;
    }
  } else {
    h+=`<div class="notice">Pentru un link cu poze, GIF-uri și clipuri, intră în cont (☁️). Durează un minut.</div>
      <div class="row"><button class="btn" id="shLogin" style="flex:1">☁️ Intră în cont</button>
      <button class="btn ghost" id="shText" style="flex:1">⚡ Link rapid, doar text</button></div><div id="shOut"></div>`;
  }
  h+=`<p class="meta" style="margin-top:12px">📜 Licența: ${esc(licName(r.license))}. O schimbi din ✏️ Editează.</p>`;
  B.innerHTML=h; $('#sheet').classList.add('on');
  const bindCopy=()=>B.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>shareLink(b.dataset.copy,r.title));
  bindCopy();
  $('#shX').onclick=closeSheet;
  if($('#shPub')) $('#shPub').onclick=async()=>{
    const b=$('#shPub'); b.disabled=true; b.textContent='⏳ Se publică…';
    try{ await publishShare(r,t=>b.textContent=t); openShare(id); toast('✅ Linkul e gata'); }
    catch(e){ console.error(e); b.disabled=false; b.textContent='🔗 Încearcă din nou'; toast('⚠️ '+(e.message||'Nu am putut publica')); }
  };
  if($('#shStop')) $('#shStop').onclick=async()=>{
    if(!confirm('Oprești distribuirea? Linkul nu va mai funcționa.')) return;
    try{ await unshareRecipe(r); openShare(id); toast('Linkul a fost oprit'); }catch(e){ toast('⚠️ '+(e.message||e)); }
  };
  if($('#shLogin')) $('#shLogin').onclick=()=>{closeSheet();go('account');};
  if($('#shText')) $('#shText').onclick=async()=>{
    const u=appBase()+'#p='+await packText(r);
    $('#shOut').innerHTML=box(u)+`<p class="meta">Linkul conține doar textul rețetei, fără poze și clipuri.</p>`; bindCopy();
  };
}

async function clearPublicFolder(folder){
  const {data:fl}=await sb.storage.from(PUB_BUCKET).list(folder,{limit:1000});
  if(fl?.length) await sb.storage.from(PUB_BUCKET).remove(fl.map(f=>`${folder}/${f.name}`));
}
async function publishShare(r,progress){
  const me=cloudUser.id;
  if(!r.share && !isPremium() && S.recipes.filter(x=>x.share).length>=FREE_LIMITS.links) throw new Error(t('Planul gratuit are 3 linkuri active. Oprește unul sau treci la Premium ⭐'));
  let sid=r.share?.id;
  if(!sid){ // poate a fost distribuită de pe alt dispozitiv
    const {data,error}=await sb.from('shared_recipes').select('id').eq('recipe_id',r.id).maybeSingle();
    if(error) throw error;
    sid=data?.id||shareId();
  }
  const folder=`${me}/${sid}`;
  const {data:ex,error:le}=await sb.storage.from(PUB_BUCKET).list(folder,{limit:1000});
  if(le) throw le;
  const have=new Set((ex||[]).map(f=>f.name)), used=new Set();
  const all=[r.cover,...r.steps.map(x=>x.media)].filter(Boolean); let n=0;
  const up=async mid=>{
    if(!mid) return null;
    const name=mid.replace(/[^\w.-]/g,'_'), path=`${folder}/${name}`; used.add(name);
    if(!have.has(name)){ // id-urile media nu se schimbă, deci ce e deja urcat nu se mai urcă
      const b=await getMedia(mid); if(!b) return null;
      progress?.(`⏳ Se urcă ${++n}/${all.length}…`);
      const {error}=await sb.storage.from(PUB_BUCKET).upload(path,b,{contentType:b.type||'application/octet-stream',upsert:true});
      if(error) throw error;
    }
    return sb.storage.from(PUB_BUCKET).getPublicUrl(path).data.publicUrl;
  };
  const data={title:r.title,desc:r.desc,cat:r.cat,emoji:r.emoji,time:r.time,servings:r.servings,ingredients:r.ingredients,
    cover:await up(r.cover),author:r.author,license:r.license,inspo:r.inspo?{url:r.inspo.url,author:r.inspo.author||''}:null,steps:[]};
  for(const x of r.steps) data.steps.push({text:x.text,min:x.min||0,mediaType:x.mediaType,media:await up(x.media)});
  // imaginea de previzualizare pentru WhatsApp / Facebook / Telegram, refăcută la fiecare publicare
  progress?.('⏳ Se face imaginea de previzualizare…');
  const og=await makeOgImage(r); used.add('og.jpg');
  if(og){
    const {error}=await sb.storage.from(PUB_BUCKET).upload(`${folder}/og.jpg`,og,{contentType:'image/jpeg',upsert:true});
    if(error) throw error;
    data.og=sb.storage.from(PUB_BUCKET).getPublicUrl(`${folder}/og.jpg`).data.publicUrl+'?v='+Date.now(); // altfel aplicațiile țin minte poza veche
  }
  const {error}=await sb.from('shared_recipes').upsert({id:sid,owner:me,recipe_id:r.id,data,updated_at:new Date().toISOString()});
  if(error) throw error;
  const stale=[...have].filter(f=>!used.has(f)).map(f=>`${folder}/${f}`);
  if(stale.length) await sb.storage.from(PUB_BUCKET).remove(stale);
  r.share={id:sid,at:Date.now()}; save();
}
// 1200×630, formatul pe care WhatsApp îl afișează ca previzualizare mare; JPEG ~100 KB.
async function makeOgImage(r){
  try{
    const W=1200,H=630,c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#f4a340'); g.addColorStop(1,'#e8603c');
    x.fillStyle=g; x.fillRect(0,0,W,H);
    let src=null;
    const pic=r.cover || r.steps.find(s=>s.media && s.mediaType!=='video')?.media;
    if(pic) src=await loadImg(await mediaURL(pic)).catch(()=>null);
    if(!src){ const v=r.steps.find(s=>s.media && s.mediaType==='video')?.media;
      if(v){ src=await loadVid(await mediaURL(v)).catch(()=>null); if(src) await seek(src,Math.min(1,(src.duration||2)/2)); } }
    if(src){
      const sw=src.videoWidth||src.naturalWidth, sh=src.videoHeight||src.naturalHeight, k=Math.max(W/sw,H/sh);
      x.drawImage(src,(W-sw*k)/2,(H-sh*k)/2,sw*k,sh*k);
      const d=x.createLinearGradient(0,H*.35,0,H); d.addColorStop(0,'rgba(0,0,0,0)'); d.addColorStop(1,'rgba(0,0,0,.82)');
      x.fillStyle=d; x.fillRect(0,0,W,H);
    } else {
      x.font='300px serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(r.emoji||'🍽️',W*.78,H*.42);
    }
    // eticheta mărcii
    x.font='800 34px Fraunces, Georgia, serif'; x.textAlign='left'; x.textBaseline='middle';
    const tag='Pas cu Gust', tw=x.measureText(tag).width;
    x.fillStyle='#fff'; x.beginPath(); x.roundRect(48,44,tw+48,62,31); x.fill();
    x.fillStyle='#e8603c'; x.fillText(tag,72,76);
    // titlul (max. 2 rânduri) și detaliile
    x.fillStyle='#fff'; x.textBaseline='alphabetic'; x.font='800 68px Fraunces, Georgia, serif';
    const maxW=src?W-96:W*.58, words=String(r.title||'Rețetă').split(/\s+/), lines=[]; let line='';
    for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW && line){lines.push(line);line=w;} else line=t; }
    lines.push(line);
    if(lines.length>2){ lines.length=2; lines[1]=lines[1].replace(/\s*\S*$/,'')+'…'; }
    const sub=[t(`${r.steps.length} pași`),fmtTime(r.time),r.author?t('de '+r.author):''].filter(Boolean).join('  ·  ');
    const y0=H-70-(lines.length-1)*78-58;
    lines.forEach((l,k)=>x.fillText(l,48,y0+k*78));
    x.font='600 32px Inter, sans-serif'; x.globalAlpha=.92; x.fillText(sub,48,H-58); x.globalAlpha=1;
    return await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',.82));
  }catch(e){ console.error(e); return null; }
}
async function unshareRecipe(r){
  const sid=r.share?.id; if(!sid) return;
  const {error}=await sb.from('shared_recipes').delete().eq('id',sid);
  if(error) throw error;
  await clearPublicFolder(`${cloudUser.id}/${sid}`);
  delete r.share; save();
}

// Salvează rețeta primită în rețetele mele (cu tot cu poze/clipuri).
async function saveShared(r=SHARED,opt={}){
  if(!r) return null;
  if(r._savedAs && S.recipes.some(x=>x.id===r._savedAs)) return r._savedAs;
  if(r._world){ const had=S.recipes.find(x=>x.from===r.id); if(had) return r._savedAs=had.id; }
  toast('💾 Se salvează…');
  const grab=async u=>{ if(!u) return null; if(isAsset(u)) return u; try{ const res=await fetch(u); if(!res.ok) return null; return await putMedia(await res.blob()); }catch(e){ return null; } };
  const copy={id:uid(),title:r.title,desc:r.desc,cat:r.cat,emoji:r.emoji,time:r.time,servings:r.servings,ingredients:[...r.ingredients],
    cover:await grab(r.cover),author:r.author,license:r.license,inspo:r.inspo||null,fav:!!opt.fav,imported:true,from:r._shareId||(r._world?r.id:null),country:r.country||null,steps:[],created:Date.now(),updated:Date.now()};
  for(const x of r.steps){ const m=await grab(x.media); copy.steps.push({text:x.text,min:x.min,media:m,mediaType:m?x.mediaType:null}); }
  S.recipes.unshift(copy); save(); r._savedAs=copy.id;
  toast(opt.fav?'❤️ Salvată la favorite':'✅ Salvată în rețetele tale');
  return copy.id;
}
// din feed: o rețetă din lume ajunge în rețetele tale, la favorite
async function likeWorld(r){
  const id=await saveShared(r,{fav:true}); const c=id&&S.recipes.find(x=>x.id===id);
  if(c && !c.fav){ c.fav=true; save(); toast('❤️ Salvată la favorite'); }
  track('save',r);
}

/* ---------- CATALOGUL MONDIAL ---------- */
const LI=()=>Math.max(0,LANG_ORDER.indexOf(LANG));
const cName=cc=>WORLD_COUNTRIES[cc]?.[1+LI()]||cc;
const rName=k=>WORLD_REGIONS.find(x=>x[0]===k)?.[1+LI()]||k;
const WCACHE={};
function worldById(id){
  if(typeof id!=='string'||!id.startsWith('w-')) return null;
  const k=LANG+':'+id; if(WCACHE[k]) return WCACHE[k];
  const w=WORLD.find(x=>x.id===id); if(!w) return null;
  const full=w.L[LANG], base=full||w.L.en, tr=w.T[LANG];
  return WCACHE[k]={id,_world:true,_shared:true,_partial:!full,country:w.cc,title:full?full.t:(tr?.[0]||base.t),desc:full?full.d:(tr?.[1]||base.d),
    cat:w.cat,emoji:w.emoji,time:w.time,servings:w.servings,ingredients:[...base.i],steps:base.s.map(([text,min])=>({text,min,media:null,mediaType:null})),
    cover:WORLD_COVER_IDS.includes(id)?`img/${id}.jpg`:null,author:'Pas cu Gust',license:'CC0',fav:false};
}
function worldCountries(){
  const m={};
  WORLD.forEach(w=>(m[w.cc]=m[w.cc]||[]).push(w.id));
  m.RO=SEED.map(x=>x.id).filter(id=>S.recipes.some(r=>r.id===id&&!r.imported));
  return m;
}
let worldRegion='all';
function renderWorld(cc){
  const V=$('#v-world'), M=worldCountries();
  if(cc && M[cc]){
    const items=M[cc].map(byId).filter(Boolean);
    V.innerHTML=`<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="wBack">← Țări</button></div>
      <h1 style="margin:10px 0">${flagOf(cc)} <span class="nt">${esc(cName(cc))}</span></h1>
      <button class="btn" id="wFeed" style="width:100%">▶ Vezi rețetele ca într-un clip</button>
      <div class="grid">${items.map(r=>`<div class="card rcard" data-id="${r.id}">
        ${r.cover?`<img class="cover" data-media="${r.cover}" alt="">`:`<div class="ph">${esc(r.emoji||'🍽️')}</div>`}
        <div class="rbody"><h3 class="nt">${esc(r.title)}</h3><p class="meta nt" style="margin:4px 0">${esc(r.desc)}</p>
        <div class="meta"><span>⏱ ${fmtTime(r.time)||'—'}</span><span>📋 ${r.steps.length} pași</span></div>
        <div style="margin-top:6px"><span class="badge">${esc(r.cat)}</span></div></div></div>`).join('')}</div>`;
    $('#wBack').onclick=()=>go('world');
    $('#wFeed').onclick=()=>{ feedFilter=cc; go('feed'); };
    V.querySelectorAll('.rcard').forEach(c=>c.onclick=()=>go('detail',c.dataset.id));
    hydrate(V); return;
  }
  const codes=Object.keys(M).filter(c=>M[c].length);
  V.innerHTML=`<h1 style="margin:10px 0">🌍 Rețete din toată lumea</h1>
    <p class="meta">Alege o țară. Fiecare rețetă se gătește pas cu pas, cu cronometru și citire cu voce.</p>
    <input class="search" id="wq" placeholder="🔎 Caută o țară sau o rețetă…" style="margin-top:12px">
    <div class="chips" id="wreg">${[['all','🌐 Toate'],...WORLD_REGIONS.map(r=>[r[0],null])].map(([k,l])=>`<button class="chip ${k===worldRegion?'on':''}" data-r="${k}">${l?l:`<span class="nt">${esc(rName(k))}</span>`}</button>`).join('')}</div>
    <div class="cgrid" id="wgrid"></div>`;
  const draw=()=>{
    const q=($('#wq').value||'').trim().toLowerCase();
    const list=codes.filter(c=>worldRegion==='all'||WORLD_COUNTRIES[c][0]===worldRegion).filter(c=>{
      if(!q) return true;
      return WORLD_COUNTRIES[c].slice(1).some(n=>n.toLowerCase().includes(q)) || M[c].some(id=>{ const r=byId(id); return r&&(r.title+' '+r.ingredients.join(' ')).toLowerCase().includes(q); });
    }).sort((a,b)=>cName(a).localeCompare(cName(b),locale()));
    $('#wgrid').innerHTML=list.length?list.map(c=>`<button class="card ctile" data-cc="${c}"><div class="fl">${flagOf(c)}</div><b class="nt">${esc(cName(c))}</b><small>${M[c].length===1?'1 rețetă':M[c].length+' rețete'}</small></button>`).join('')
      :`<div class="empty" style="grid-column:1/-1">Nicio țară găsită.</div>`;
    $('#wgrid').querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>go('world',b.dataset.cc));
  };
  $('#wq').oninput=draw;
  V.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ worldRegion=b.dataset.r; V.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b)); draw(); });
  draw();
}

// link de forma ?w=w-it: deschide direct rețeta din catalog
function openWorldFromUrl(){
  const w=new URLSearchParams(location.search).get('w'); if(!w) return false;
  history.replaceState(null,'',location.pathname);
  if(!worldById(w)) return false;
  track('link_open',null,'world'); go('detail',w); return true;
}
function closeShared(){
  SHARED=null;
  if(location.search.includes('r=')||location.hash.startsWith('#p=')) history.replaceState(null,'',location.pathname);
}
async function openShareTarget(){
  const q=new URLSearchParams(location.search); if(!q.has('share')) return false;
  const url=firstUrl(q.get('url'))||firstUrl(q.get('text'))||firstUrl(q.get('title'));
  history.replaceState(null,'',location.pathname);
  const p=url&&parseInspo(url); if(!p){ go('edit'); return true; }
  const meta=await inspoMeta(p.url);
  go('edit'); renderEdit(null,{inspo:{url:p.url,platform:p.platform,author:meta?.author||''},title:'',desc:''});
  toast('✨ Inspirație adăugată. Acum scrie varianta ta!');
  return true;
}
async function openSharedFromUrl(){
  const q=new URLSearchParams(location.search).get('r');
  const h=location.hash.startsWith('#p=')?location.hash.slice(3):null;
  if(!q && !h) return;
  try{
    if(h) SHARED=await unpackText(h);
    else {
      if(!/^[A-Za-z0-9]{8,16}$/.test(q)) throw 0;
      await cloudReady; if(!sb) throw new Error('offline');
      const {data,error}=await sb.rpc('get_shared_recipe',{share_id:q});
      if(error) throw error; if(!data) throw 0;
      SHARED=cleanShared(data,{_shareId:q});
    }
    document.title=SHARED.title+' — Pas cu Gust';
    track('link_open',null,h?'text':'link');
    go('detail','shared');
  }catch(e){
    if(e instanceof Error) console.error(e);
    toast(e?.message==='offline'?'Fără internet: linkul nu se poate deschide acum':'Linkul nu mai există sau e greșit');
    history.replaceState(null,'',location.pathname);
  }
}
